version: '1'
name: DAL - Long Wait Resume (>6s)
description: |
  Purpose:
    Exercises the pause-and-resume path. A wait step with duration >6s
    causes the engine to park the execution in WAITING state and schedule
    a workflow:resume task rather than blocking the runner thread. On
    resume, the DAL retrieves the parked execution, marks the wait step
    as responded, and continues to the final step.

  How to run:
    Trigger once from the Workflows UI or API. The workflow will sit in
    WAITING state for ~10 minutes — no manual intervention is needed.

  Expected behavior:
    - pre_wait_log executes immediately.
    - Workflow transitions to WAITING state once long_wait starts.
    - After ~10 minutes the engine resumes the workflow automatically.
    - long_wait transitions to COMPLETED; post_wait_log executes.
    - Workflow status: COMPLETED.
enabled: true
tags:
  - dal
  - wait
  - resume
triggers:
  - type: manual
steps:
  - name: pre_wait_log
    type: console
    with:
      message: 'Pre-wait step executed. Workflow will now park for a long wait.'

  - name: long_wait
    type: wait
    with:
      duration: 10m

  - name: post_wait_log
    type: console
    with:
      message: 'Workflow resumed after long wait. DAL resume path is healthy.'
