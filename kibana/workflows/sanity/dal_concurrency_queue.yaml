version: '1'
name: DAL - Concurrency Queue Strategy
description: |
  Purpose:
    Exercises the `queue` concurrency strategy. With max=1, a second run
    arriving while the first is active is stored as QUEUED rather than
    dropped or cancelled. Once the first run releases its slot, the engine
    promotes the oldest QUEUED entry to PENDING and starts it.

  How to run:
    Trigger twice in quick succession — the second trigger should arrive
    before the first run reaches the `release` step (~8s after start).

  Expected behavior:
    - First execution: COMPLETED after ~8s.
    - Second execution: initially QUEUED, then promoted to PENDING once the
      first finishes, then COMPLETED.
    - Only one execution is in RUNNING state at any time.
    - Queued entries older than queue-ttl (2m) are automatically expired.
enabled: true
tags:
  - dal
  - concurrency
  - queue
settings:
  concurrency:
    max: 1
    strategy: queue
    queue-size: 5
    queue-ttl: 2m
triggers:
  - type: manual
steps:
  - name: hold_slot
    type: console
    with:
      message: 'Holding the concurrency slot. A second run will queue behind this one.'

  - name: short_wait
    type: wait
    with:
      duration: 8s

  - name: release
    type: console
    with:
      message: 'Slot released. The queued execution should now be promoted and start.'
