version: '1'
name: DAL - Step Retry then Fallback on Persistent Failure
description: |
  Purpose:
    Exercises step retry tracking and fallback execution. The step always
    fails (searches a non-existent index), exhausting all retries and then
    running the fallback branch. Verifies that the DAL records each failed
    attempt separately and that the fallback prevents top-level failure.

  How to run:
    Trigger once from the Workflows UI or API. No special setup required —
    the non-existent index guarantees failure on every attempt.

  Expected behavior:
    - search_nonexistent_index executes 3 times (1 initial + 2 retries),
      all FAILED with index_not_found_exception.
    - fallback_notify executes once after retries are exhausted, COMPLETED.
    - final_step executes once, COMPLETED.
    - Workflow status: COMPLETED (fallback prevents propagation of the error).
enabled: true
tags:
  - dal
  - retry
  - fallback
  - error-handling
triggers:
  - type: manual
steps:
  - name: search_nonexistent_index
    type: elasticsearch.search
    with:
      index: .dal-test-nonexistent-index-that-does-not-exist
      size: 1
      query:
        match_all: {}
    on-failure:
      retry:
        max-attempts: 2
        delay: 1s
      fallback:
        - name: fallback_notify
          type: console
          with:
            message: |
              Search failed after retries. Continuing via fallback path.

  - name: final_step
    type: console
    with:
      message: 'Workflow completed via fallback. DAL retry tracking is healthy.'
