version: '1'
name: DAL - Cancellation of Long-Running Workflow Mid-Foreach
description: |
  Purpose:
    Exercises clean cancellation mid-foreach. A 10-item loop with ~2s per
    iteration gives a wide window to cancel between steps. Verifies that
    the engine halts the loop, marks in-progress step executions as failed,
    and leaves no step executions in a non-terminal state.

  How to run:
    1. Trigger the workflow from the Workflows UI or API.
    2. While the workflow is in RUNNING state, cancel it via the UI
       (the cancel button) or the API cancel endpoint.
    3. Cancel after at least one iteration has started for a meaningful result.

  Expected behavior:
    - Workflow status: CANCELLED.
    - Only the iterations that started before the cancellation checkpoint
      complete; the rest are never executed.
    - No step executions remain in a non-terminal (e.g. RUNNING) state
      after cancellation processing finishes.
enabled: true
tags:
  - dal
  - cancellation
  - foreach
consts:
  items: '["item-01","item-02","item-03","item-04","item-05","item-06","item-07","item-08","item-09","item-10"]'
triggers:
  - type: manual
steps:
  - name: start_log
    type: console
    with:
      message: 'Starting 10-item foreach. Request cancellation while this runs to test the cancel path.'

  - name: process_items
    type: foreach
    foreach: '{{ consts.items }}'
    steps:
      - name: process_item
        type: console
        with:
          message: 'Processing {{ foreach.item }} ({{ foreach.index | plus: 1 }} of {{ foreach.total }})'

      - name: item_wait
        type: wait
        with:
          duration: 2s

  - name: completion_log
    type: console
    with:
      message: 'All items processed (cancellation was not requested or arrived too late).'
