version: '1'
name: DAL - Switch Routing by Computed Value
description: |
  Purpose:
    Exercises switch-based conditional routing. The switch evaluates the
    string output of a preceding console step and routes execution to one
    of three branches. Verifies that only the matched branch executes and
    the DAL records exactly that branch's step execution.

  How to run:
    Trigger once from the Workflows UI or API. Change `consts.severity`
    to `critical`, `warning`, or anything else to exercise each branch.

  Expected behavior:
    - Exactly one branch handler executes:
        consts.severity = critical  → critical_handler runs.
        consts.severity = warning   → warning_handler runs.
        any other value             → default_handler runs.
    - classify_event and summary always execute.
    - Workflow status: COMPLETED.
enabled: true
tags:
  - dal
  - switch
  - routing
consts:
  severity: 'critical'
triggers:
  - type: manual
steps:
  - name: classify_event
    type: console
    with:
      message: '{{ consts.severity }}'

  - name: route_by_severity
    type: switch
    expression: '{{ steps.classify_event.output }}'
    cases:
      - match: critical
        steps:
          - name: critical_handler
            type: console
            with:
              message: 'CRITICAL severity detected. Escalating immediately.'
      - match: warning
        steps:
          - name: warning_handler
            type: console
            with:
              message: 'WARNING severity detected. Logging for review.'
    default:
      - name: default_handler
        type: console
        with:
          message: 'Severity "{{ consts.severity }}" is below threshold. No action required.'

  - name: summary
    type: console
    with:
      message: 'Routing complete. Switch step DAL path is healthy.'
