version: '1'
name: DAL - Concurrency Drop Strategy
description: |
  Purpose:
    Exercises the `drop` concurrency strategy. With max=1, a second run
    arriving while the first holds the slot is immediately cancelled (dropped)
    without being queued or started. Verifies that the CAS scriptUpdate
    guards against races that could allow two runs to occupy the same slot.

  How to run:
    Trigger twice in quick succession — the second trigger should arrive
    before the first run finishes its 8s wait.

  Expected behavior:
    - First execution: COMPLETED after ~8s.
    - Second execution: immediately CANCELLED with a reason indicating
      it was dropped due to the max=1 concurrency limit.
    - No two executions are ever in RUNNING state simultaneously.
enabled: true
tags:
  - dal
  - concurrency
  - drop
settings:
  concurrency:
    max: 1
    strategy: drop
triggers:
  - type: manual
steps:
  - name: slow_work
    type: console
    with:
      message: 'Slot is occupied. A concurrent trigger should be dropped.'

  - name: wait_to_hold_slot
    type: wait
    with:
      duration: 8s

  - name: finish
    type: console
    with:
      message: 'Execution completed. Concurrency slot released.'
