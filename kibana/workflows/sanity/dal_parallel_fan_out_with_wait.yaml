version: '1'
name: DAL - Parallel Static Branches with Mixed Wait Durations
description: |
  Purpose:
    Exercises concurrent branch execution with mixed wait durations.
    Three named parallel branches run simultaneously. The long_wait branch
    waits 10m, which exceeds the 6s in-process threshold and causes the
    engine to park the execution in WAITING state and schedule a resume task.

  How to run:
    Trigger once from the Workflows UI or API. The workflow will park in
    WAITING state for ~10 minutes while the long_wait branch waits — no
    manual intervention is needed.

  Expected behavior:
    - immediate branch completes right away.
    - short_wait branch completes after ~3s (in-process sleep).
    - Workflow transitions to WAITING state once long_wait starts its 10m pause.
    - After ~10 minutes the engine resumes the workflow; long_wait branch
      transitions to COMPLETED.
    - all_done step executes after all branches finish.
    - Workflow status: COMPLETED.
enabled: true
tags:
  - dal
  - parallel
  - wait
  - resume
triggers:
  - type: manual
steps:
  - name: parallel_branches
    type: parallel
    branches:
      - name: immediate
        steps:
          - name: immediate_log
            type: console
            with:
              message: 'Immediate branch started and completed.'

      - name: short_wait
        steps:
          - name: short_wait_log
            type: console
            with:
              message: 'Short-wait branch started. Waiting 3s.'
          - name: do_short_wait
            type: wait
            with:
              duration: 3s
          - name: short_wait_done
            type: console
            with:
              message: 'Short-wait branch completed after 3s.'

      - name: long_wait
        steps:
          - name: long_wait_log
            type: console
            with:
              message: 'Long-wait branch started. Parking for 10m (triggers resume task).'
          - name: do_long_wait
            type: wait
            with:
              duration: 10m
          - name: long_wait_done
            type: console
            with:
              message: 'Long-wait branch completed after resume. DAL parallel+wait path is healthy.'

  - name: all_done
    type: console
    with:
      message: 'All parallel branches completed. DAL concurrent write path is healthy.'
