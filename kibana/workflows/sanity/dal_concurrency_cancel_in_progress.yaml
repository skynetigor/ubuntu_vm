version: '1'
name: DAL - Concurrency Cancel-in-Progress Strategy
description: |
  Purpose:
    Exercises the `cancel-in-progress` concurrency strategy. When a new
    execution arrives while one is already running, the engine cancels the
    active execution and immediately starts the new one. Verifies the DAL's
    bulk update path used to transition the running execution to CANCELLED.

  How to run:
    Trigger twice in quick succession — the second trigger should arrive
    before the first run finishes its 30s wait.

  Expected behavior:
    - First execution: CANCELLED (preempted by the second run).
    - Second execution: COMPLETED.
    - The first execution's cancellationReason references the concurrency limit.
    - should_not_reach_here step in the first execution never executes.
enabled: true
tags:
  - dal
  - concurrency
  - cancel-in-progress
settings:
  concurrency:
    max: 1
    strategy: cancel-in-progress
triggers:
  - type: manual
steps:
  - name: hold_slot
    type: console
    with:
      message: 'Occupying the concurrency slot. A second trigger will cancel this run.'

  - name: long_wait
    type: wait
    with:
      duration: 30s

  - name: should_not_reach_here
    type: console
    with:
      message: 'ERROR: this step should never execute - the run should have been cancelled.'
