version: '1'
name: DAL - While Loop Simulated Poll until Condition
description: |
  Purpose:
    Exercises the while loop with an early-exit condition. The loop allows
    up to 5 iterations but the condition `while.iteration < 3` causes it
    to exit after 3, simulating a polling pattern where a watched condition
    becomes true before the max-iterations limit is reached.

  How to run:
    Trigger once from the Workflows UI or API. No special setup required.

  Expected behavior:
    - poll_loop body (check_condition → short_pause → iteration_result)
      executes exactly 3 times (iterations 0, 1, 2).
    - Loop exits early because the condition becomes false at iteration 3.
    - poll_complete step executes once after the loop.
    - Workflow status: COMPLETED.
enabled: true
tags:
  - dal
  - while
  - polling
triggers:
  - type: manual
steps:
  - name: poll_loop
    type: while
    condition: '${{ while.iteration < 3 }}'
    max-iterations: 5
    steps:
      - name: check_condition
        type: console
        with:
          message: 'Poll iteration {{ while.iteration }}. Checking condition...'

      - name: short_pause
        type: wait
        with:
          duration: 1s

      - name: iteration_result
        type: console
        with:
          message: 'Iteration {{ while.iteration }} complete. Condition not yet met, continuing.'

  - name: poll_complete
    type: console
    with:
      message: 'Polling finished after 3 iterations. DAL while-loop write path is healthy.'
