version: '1'
name: DAL - Output Eviction and Null vs Undefined Recovery
description: |
  Purpose:
    Exercises output eviction and null-normalization in the DAL. When step
    outputs accumulate, the engine evicts older ones from the execution
    document. Evicted outputs are stored as undefined in ES; the DAL must
    normalize these to null so downstream templates receive null rather
    than crashing with an unexpected undefined.

  How to run:
    Trigger once from the Workflows UI or API. No special setup required.
    Eviction may or may not occur depending on cluster state, but the
    workflow must complete correctly either way.

  Expected behavior:
    - All output_step_* steps complete as COMPLETED.
    - downstream_read reads back earlier step outputs — evicted outputs
      appear as `null/evicted` via the `default` filter, not as an error.
    - Workflow status: COMPLETED regardless of whether eviction occurred.
enabled: true
tags:
  - dal
  - output-eviction
  - null-normalization
triggers:
  - type: manual
steps:
  - name: output_step_1
    type: console
    with:
      message: 'Step 1 output data'

  - name: output_step_2
    type: console
    with:
      message: 'Step 2 output data'

  - name: output_step_3
    type: console
    with:
      message: 'Step 3 output data'

  - name: output_step_4
    type: console
    with:
      message: 'Step 4 output data'

  - name: output_step_5
    type: console
    with:
      message: 'Step 5 output data'

  - name: downstream_read
    type: console
    with:
      message: |
        Reading outputs from prior steps:
          step_1={{ steps.output_step_1.output | default: "null/evicted" }}
          step_2={{ steps.output_step_2.output | default: "null/evicted" }}
          step_5={{ steps.output_step_5.output | default: "null/evicted" }}
        DAL null-normalization path is healthy.

  - name: completion_log
    type: console
    with:
      message: 'Output eviction recovery test complete.'
