version: '1'
name: Deploy Kibana Preview
description: |
  Resolves a GitHub PR / branch / commit URL, then runs
  clone → bootstrap → compile → docker compose up inside the dev-vm.
  Ports are auto-assigned from 5003-5999 and reused on re-deploy.
tags:
  - kibana
  - preview
  - deploy
  - remote-host

settings:
  concurrency:
    key: '{{workflow.id}}'
    strategy: queue

consts:
  UBUNTU_VM_REPO: https://github.com/skynetigor/ubuntu_vm.git
  UBUNTU_VM_BRANCH: main

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - kibana_target
      properties:
        kibana_target:
          type: string
          description: |
            GitHub URL to deploy. Accepted formats:
              PR     — https://github.com/<owner>/<repo>/pull/<number>
              Branch — https://github.com/<owner>/<repo>/tree/<branch>
              Commit — https://github.com/<owner>/<repo>/commit/<sha>

steps:
  # ── Step 1: Clone / update the ubuntu_vm repo ────────────────────────────
  - name: update_ubuntu_vm
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        DEPLOY_DIR="/opt/deploy"
        UBUNTU_VM_REPO="{{ consts.UBUNTU_VM_REPO }}"
        UBUNTU_VM_BRANCH="{{ consts.UBUNTU_VM_BRANCH }}"

        if [ -d "$DEPLOY_DIR/.git" ]; then
          echo "=== Updating ubuntu_vm ($UBUNTU_VM_BRANCH) ==="
          git -C "$DEPLOY_DIR" fetch --depth 1 origin "$UBUNTU_VM_BRANCH"
          git -C "$DEPLOY_DIR" reset --hard FETCH_HEAD
        else
          echo "=== Cloning ubuntu_vm ($UBUNTU_VM_BRANCH) ==="
          sudo mkdir -p "$DEPLOY_DIR"
          sudo chown "$USER:$USER" "$DEPLOY_DIR"
          git clone --depth 1 --branch "$UBUNTU_VM_BRANCH" "$UBUNTU_VM_REPO" "$DEPLOY_DIR"
        fi
        echo "=== ubuntu_vm at $(git -C "$DEPLOY_DIR" rev-parse HEAD) ==="

  # ── Step 2: Resolve target URL → fork / branch / commit / project name ───
  - name: resolve
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        TARGET="{{ inputs.kibana_target }}"
        mkdir -p /opt/deploy-resolve

        if echo "$TARGET" | grep -qE 'github\.com/[^/]+/[^/]+/pull/[0-9]+'; then
          # ── PR URL ─────────────────────────────────────────────────────────
          OWNER=$(echo "$TARGET"  | sed -E 's|https://github\.com/([^/]+)/.*|\1|')
          REPO=$(echo "$TARGET"   | sed -E 's|https://github\.com/[^/]+/([^/]+)/.*|\1|')
          PR_NUM=$(echo "$TARGET" | sed -E 's|.*/pull/([0-9]+).*|\1|')

          echo "=== Resolving PR #$PR_NUM in $OWNER/$REPO ==="
          PR_JSON=$(curl -sf "https://api.github.com/repos/$OWNER/$REPO/pulls/$PR_NUM")
          if [ -z "$PR_JSON" ]; then
            echo "ERROR: GitHub API returned no data — check the PR URL"
            exit 1
          fi
          KIBANA_FORK=$(echo "$PR_JSON"   | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['head']['repo']['clone_url'])")
          KIBANA_BRANCH=$(echo "$PR_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['head']['ref'])")
          KIBANA_COMMIT=$(echo "$PR_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['head']['sha'])")
          PROJECT="pr-${PR_NUM}"

        elif echo "$TARGET" | grep -qE 'github\.com/[^/]+/[^/]+/tree/'; then
          # ── Branch URL ─────────────────────────────────────────────────────
          OWNER=$(echo "$TARGET" | sed -E 's|https://github\.com/([^/]+)/.*|\1|')
          REPO=$(echo "$TARGET"  | sed -E 's|https://github\.com/[^/]+/([^/]+)/.*|\1|')
          KIBANA_FORK="https://github.com/$OWNER/$REPO"
          KIBANA_BRANCH=$(echo "$TARGET" | sed -E "s|https://github\.com/[^/]+/[^/]+/tree/||")
          KIBANA_COMMIT=""
          PROJECT=$(echo "$KIBANA_BRANCH" \
            | tr '[:upper:]/' '[:lower:]-' \
            | sed 's/[^a-z0-9-]/-/g' \
            | cut -c1-50)

        elif echo "$TARGET" | grep -qE 'github\.com/[^/]+/[^/]+/commit/[0-9a-f]+'; then
          # ── Commit URL ─────────────────────────────────────────────────────
          OWNER=$(echo "$TARGET" | sed -E 's|https://github\.com/([^/]+)/.*|\1|')
          REPO=$(echo "$TARGET"  | sed -E 's|https://github\.com/[^/]+/([^/]+)/.*|\1|')
          KIBANA_FORK="https://github.com/$OWNER/$REPO"
          KIBANA_BRANCH=""
          KIBANA_COMMIT=$(echo "$TARGET" | sed -E 's|.*/commit/([0-9a-f]+).*|\1|')
          PROJECT="commit-${KIBANA_COMMIT:0:8}"

        else
          echo "ERROR: unrecognised URL — expected one of:"
          echo "  https://github.com/<owner>/<repo>/pull/<number>"
          echo "  https://github.com/<owner>/<repo>/tree/<branch>"
          echo "  https://github.com/<owner>/<repo>/commit/<sha>"
          exit 1
        fi

        if [ -z "$KIBANA_FORK" ] || [ -z "$PROJECT" ]; then
          echo "ERROR: resolve produced empty KIBANA_FORK or PROJECT — aborting"
          exit 1
        fi

        printf 'KIBANA_FORK=%s\nKIBANA_BRANCH=%s\nKIBANA_COMMIT=%s\nPROJECT=%s\n' \
          "$KIBANA_FORK" "$KIBANA_BRANCH" "$KIBANA_COMMIT" "$PROJECT" \
          > /opt/deploy-resolve/latest

        echo "=== Resolved ==="
        cat /opt/deploy-resolve/latest

  # ── Step 3: Assign ports for this project ────────────────────────────────
  - name: assign_ports
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        set -a; source /opt/deploy-resolve/latest; set +a
        PORTS_DIR="/opt/deploy-ports"
        mkdir -p "$PORTS_DIR"
        PORT_FILE="$PORTS_DIR/$PROJECT"

        find_free_port() {
          local start=$1
          for port in $(seq "$start" 5998); do
            if ! ss -tlnp 2>/dev/null | grep -q ":${port}[^0-9]"; then
              echo "$port"
              return 0
            fi
          done
          echo "ERROR: no free port found from $start" >&2
          return 1
        }

        if [ -f "$PORT_FILE" ]; then
          set -a; source "$PORT_FILE"; set +a
          echo "=== Reusing ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
        else
          ES_PORT=$(find_free_port 5003)
          KIBANA_PORT=$(find_free_port $((ES_PORT + 1)))
          printf 'ES_PORT=%s\nKIBANA_PORT=%s\n' "$ES_PORT" "$KIBANA_PORT" > "$PORT_FILE"
          echo "=== Assigned ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
        fi

  # ── Step 4: Write kibana/.env from resolved values and assigned ports ─────
  - name: write_env
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        DEPLOY_DIR="/opt/deploy"
        set -a; source /opt/deploy-resolve/latest; set +a
        set -a; source "/opt/deploy-ports/$PROJECT"; set +a

        cat > "$DEPLOY_DIR/kibana/.env" << ENVEOF
        KIBANA_FORK=${KIBANA_FORK}
        KIBANA_BRANCH=${KIBANA_BRANCH}
        KIBANA_COMMIT=${KIBANA_COMMIT}
        ES_PORT=${ES_PORT}
        KIBANA_PORT=${KIBANA_PORT}
        LOCAL_DIR=dist
        ES_VERSION=9.6.0
        DOCKER_DEFAULT_PLATFORM=linux/amd64
        ENVEOF
        echo "=== .env written ==="
        cat "$DEPLOY_DIR/kibana/.env"

  # ── Step 5: Clone Kibana source ──────────────────────────────────────────
  - name: clone
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        bash /opt/deploy/kibana/scripts/clone.sh

  # ── Step 6: Bootstrap dependencies ───────────────────────────────────────
  - name: bootstrap
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        bash /opt/deploy/kibana/scripts/bootstrap.sh

  # ── Step 7: Compile / build distribution ─────────────────────────────────
  - name: compile
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        bash /opt/deploy/kibana/scripts/compile.sh

  # ── Step 8: Start the stack ───────────────────────────────────────────────
  - name: start
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        set -a; source /opt/deploy-resolve/latest; set +a
        KIBANA_DIR="/opt/deploy/kibana"
        docker compose -p "$PROJECT" -f "$KIBANA_DIR/docker-compose.yml" up --build -d
        echo "=== Stack started (project: $PROJECT) ==="
        docker compose -p "$PROJECT" ps

  # ── Step 9: Register Cloudflare tunnel hostname ───────────────────────────
  - name: register_tunnel
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ] || \
           [ -z "${CF_TUNNEL_ID:-}" ]; then
          echo "=== Skipping tunnel registration (CF_* vars not set) ==="
          exit 0
        fi

        set -a; source /opt/deploy-resolve/latest; set +a
        set -a; source "/opt/deploy-ports/$PROJECT"; set +a

        CNAME=$(echo "$PROJECT" | sed 's/^feature[-\/]//' | cut -c1-10)
        export CF_HOSTNAME="${CNAME}.${CF_BASE_DOMAIN}"
        export CF_SERVICE_URL="http://elastic-dev-vm:${KIBANA_PORT}"

        echo "=== Registering tunnel: $CF_HOSTNAME → $CF_SERVICE_URL ==="
        bash /opt/deploy/kibana/scripts/register-tunnel.sh

  # ── Summary ───────────────────────────────────────────────────────────────
  - name: summary
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        set -a; source /opt/deploy-resolve/latest; set +a
        set -a; source "/opt/deploy-ports/$PROJECT"; set +a
        echo "═══════════════════════════════════════════"
        echo "  Kibana Preview Deployed"
        echo "═══════════════════════════════════════════"
        echo "  Target  : {{ inputs.kibana_target }}"
        echo "  Fork    : ${KIBANA_FORK}"
        if [ -n "$KIBANA_BRANCH" ]; then
        echo "  Branch  : ${KIBANA_BRANCH}"
        fi
        if [ -n "$KIBANA_COMMIT" ]; then
        echo "  Commit  : ${KIBANA_COMMIT}"
        fi
        echo "  ES      : localhost:${ES_PORT}"
        echo "  Kibana  : http://192.168.1.7:${KIBANA_PORT}"
        CNAME=$(echo "$PROJECT" | sed 's/^feature[-\/]//' | cut -c1-10)
        if [ -n "${CF_API_TOKEN:-}" ]; then
        echo "  Public  : https://${CNAME}.${CF_BASE_DOMAIN}"
        fi
        echo "═══════════════════════════════════════════"
