version: '1'
name: Deploy Kibana Preview
description: |
  Clones the ubuntu_vm repo to /opt/deploy, writes kibana/.env from inputs,
  then runs clone → bootstrap → compile → docker compose up for the given
  Kibana fork and branch. The branch name is used as the Docker Compose project
  name so multiple branches can run side-by-side.
  Ports are auto-assigned from the 5002-5999 range and reused on re-deploy.
tags:
  - kibana
  - preview
  - deploy
  - remote-host

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      properties:
        kibana_fork:
          type: string
          description: Kibana repository URL to clone.
          default: https://github.com/elastic/kibana
        kibana_branch:
          type: string
          description: Kibana branch to build and deploy.
          default: main

steps:
  # ── Step 1: Clone / update ubuntu_vm and write .env ──────────────────────
  - name: setup
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        DEPLOY_DIR="/opt/deploy"
        PORTS_DIR="/opt/deploy-ports"
        UBUNTU_VM_REPO="https://github.com/skynetigor/ubuntu_vm.git"

        PROJECT=$(echo "{{ inputs.kibana_branch }}" \
          | tr '[:upper:]/' '[:lower:]-' \
          | sed 's/[^a-z0-9-]/-/g')

        if [ -d "$DEPLOY_DIR/.git" ]; then
          echo "=== Updating ubuntu_vm ==="
          git -C "$DEPLOY_DIR" pull --ff-only
        else
          echo "=== Cloning ubuntu_vm ==="
          sudo mkdir -p "$DEPLOY_DIR"
          sudo chown "$USER:$USER" "$DEPLOY_DIR"
          git clone --depth 1 "$UBUNTU_VM_REPO" "$DEPLOY_DIR"
        fi
        echo "=== ubuntu_vm at $(git -C "$DEPLOY_DIR" rev-parse HEAD) ==="

        # ── Port assignment ───────────────────────────────────────────────
        mkdir -p "$PORTS_DIR"
        PORT_FILE="$PORTS_DIR/$PROJECT"

        find_free_port() {
          local start=$1
          for port in $(seq "$start" 5998); do
            if ! ss -tlnp 2>/dev/null | grep -q ":${port}[^0-9]"; then
              echo "$port"
              return 0
            fi
          done
          echo "ERROR: no free port found from $start" >&2
          return 1
        }

        if [ -f "$PORT_FILE" ]; then
          set -a; source "$PORT_FILE"; set +a
          echo "=== Reusing ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
        else
          ES_PORT=$(find_free_port 5003)
          KIBANA_PORT=$(find_free_port $((ES_PORT + 1)))
          printf 'ES_PORT=%s\nKIBANA_PORT=%s\n' "$ES_PORT" "$KIBANA_PORT" > "$PORT_FILE"
          echo "=== Assigned ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
        fi

        # ── Write .env ────────────────────────────────────────────────────
        cat > "$DEPLOY_DIR/kibana/.env" << ENVEOF
        KIBANA_FORK={{ inputs.kibana_fork }}
        KIBANA_BRANCH={{ inputs.kibana_branch }}
        ES_PORT=${ES_PORT}
        KIBANA_PORT=${KIBANA_PORT}
        LOCAL_DIR=dist
        ES_VERSION=9.6.0
        DOCKER_DEFAULT_PLATFORM=linux/amd64
        ENVEOF
        echo "=== .env written ==="
        cat "$DEPLOY_DIR/kibana/.env"

  # ── Step 2: Clone Kibana source ──────────────────────────────────────────
  - name: clone
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        bash /opt/deploy/kibana/scripts/clone.sh

  # ── Step 3: Bootstrap dependencies ───────────────────────────────────────
  - name: bootstrap
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
        bash /opt/deploy/kibana/scripts/bootstrap.sh

  # ── Step 4: Compile / build distribution ─────────────────────────────────
  - name: compile
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
        bash /opt/deploy/kibana/scripts/compile.sh

  # ── Step 5: Start the stack ───────────────────────────────────────────────
  - name: start
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        KIBANA_DIR="/opt/deploy/kibana"
        PROJECT=$(echo "{{ inputs.kibana_branch }}" \
          | tr '[:upper:]/' '[:lower:]-' \
          | sed 's/[^a-z0-9-]/-/g')
        docker compose -p "$PROJECT" -f "$KIBANA_DIR/docker-compose.yml" up --build -d
        echo "=== Stack started (project: $PROJECT) ==="
        docker compose -p "$PROJECT" ps

  # ── Summary ───────────────────────────────────────────────────────────────
  - name: summary
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        PROJECT=$(echo "{{ inputs.kibana_branch }}" \
          | tr '[:upper:]/' '[:lower:]-' \
          | sed 's/[^a-z0-9-]/-/g')
        set -a; source "/opt/deploy-ports/$PROJECT"; set +a
        echo "═══════════════════════════════════════════"
        echo "  Kibana Preview Deployed"
        echo "═══════════════════════════════════════════"
        echo "  Fork    : {{ inputs.kibana_fork }}"
        echo "  Branch  : {{ inputs.kibana_branch }}"
        echo "  ES      : localhost:${ES_PORT}"
        echo "  Kibana  : http://192.168.1.7:${KIBANA_PORT}"
        echo "═══════════════════════════════════════════"
