services:
  elasticsearch:
    build:
      context: .
      dockerfile: es.Dockerfile
    environment:
      # ES_VERSION must match the Kibana branch (read from kibana's package.json: "version")
      - ES_VERSION=${ES_VERSION:-9.6.0}
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
      - ES_LICENSE=trial
      - ES_BASE_DIR=/es
    ports:
      - "5011:5601"
      - "5012:9200"
    volumes:
      - es_data:/es   # cache/ and install/<version>/ live here; survives restarts
    healthcheck:
      # $$ES_PASSWORD: docker-compose escapes $$ → $, evaluated by container shell
      test:
        - CMD-SHELL
        - 'curl -sf -u elastic:$$ES_PASSWORD http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s  # time for download + extract on first run
    restart: unless-stopped

  kibana:
    build:
      context: .
      args:
        KIBANA_REPO_URL: ${KIBANA_REPO_URL:-https://github.com/elastic/kibana}
        KIBANA_BRANCH: ${KIBANA_BRANCH:-main}
    environment:
      - KIBANA_BRANCH=${KIBANA_BRANCH:-main}
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
    network_mode: "service:elasticsearch"
    volumes:
      - ./kibana.dev.yml:/etc/kibana-config/kibana.dev.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es_data:
