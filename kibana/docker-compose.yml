services:
  elasticsearch:
    build:
      context: .
      dockerfile: es.Dockerfile
    env_file:
      - path: ./env/.env            # deployment-specific vars written by the workflow
        required: false
    environment:
      # ES_VERSION must match the Kibana branch (read from kibana's package.json: "version")
      - ES_VERSION=${ES_VERSION:-9.6.0}
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
      - ES_LICENSE=trial
      - ES_BASE_DIR=/es
    ports:
      - "${ES_PORT:-5002}:9200"
    networks:
      - elastic
    volumes:
      - es_data:/es   # cache/ and install/<version>/ live here; survives restarts
    healthcheck:
      # $$ES_PASSWORD: docker-compose escapes $$ → $, evaluated by container shell
      test:
        - CMD-SHELL
        - 'curl -sf -u elastic:$$ES_PASSWORD http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s  # time for download + extract on first run
    restart: unless-stopped

  kibana:
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION}
    env_file:
      - path: ./env/.env            # deployment-specific vars written by the workflow
        required: false
    environment:
      - ES_HOST=http://elasticsearch:9200

    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - elastic
    volumes:
      - ./kibana.dev.yml:/etc/kibana-config/kibana.dev.yml:ro
      - ${CONNECTORS_FILE:-/dev/null}:/opt/kibana/setup/connectors.yml:ro
      - ${WORKFLOWS_DIR:-/tmp}:/opt/kibana/setup/workflows:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf http://localhost:5601/api/status | grep -q "\"level\":\"available\""'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es_data:

networks:
  elastic:
    driver: bridge