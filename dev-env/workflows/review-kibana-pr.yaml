version: '1'
name: Review Kibana PR
description: >-
  Reviews changed Kibana production code and PR comments, runs workflow-project
  tests, and returns findings without modifying source or writing to GitHub.
enabled: true
tags:
  - kibana
  - review
  - automation

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - kibana_target
      properties:
        kibana_target:
          type: string
          description: GitHub PR, branch, or commit URL accepted by checkout-kibana-project.
        base_branch:
          type: string
          default: main
        session_id:
          type: string
          default: ''
        run_summary:
          type: string
          default: ''
        analyze_pr_comments:
          type: boolean
          default: true
          description: Classify existing PR review comments; review-and-fix disables this per round.
        existing_checkout:
          type: object
          default: {}
          additionalProperties: false
          properties:
            project:
              type: string
            target:
              type: string
            commit:
              type: string
            source_repository:
              type: string
            source_branch:
              type: string
            deploy_dir:
              type: string
            source_dir:
              type: string
            checkout_changed:
              type: string
            clone_skipped:
              type: string
            fetched_branches:
              type: string
            bootstrap_status:
              type: string
        concurrency_key:
          type: string
          default: kibana-review-checkout
          description: Callers that already hold the shared review checkout pass a per-run key to avoid waiting on themselves.

# Same literal key as review-and-fix-kibana-pr and review-external-kibana-pr: they share /opt/kibana-review.
settings:
  concurrency:
    key: '{{ inputs.concurrency_key }}'
    strategy: queue
    max: 1

consts:
  REVIEW_PROJECT: kibana-review
  UPSTREAM_KIBANA_REPO: https://github.com/elastic/kibana.git
  MAX_PRODUCTION_FILES: 100
  MAX_DIFF_CHARS: 160000
  MAX_AGENT_DIAGNOSTIC_CHARS: 12000
  PRODUCTION_FILE_INCLUDE_GLOBS:
    - '**/*.ts'
    - '**/*.tsx'
    - '**/*.js'
    - '**/*.jsx'
    - '**/*.mjs'
    - '**/*.cjs'
    - '**/*.json'
    - '**/*.yaml'
    - '**/*.yml'
  PRODUCTION_FILE_EXCLUDE_GLOBS:
    - '**/__tests__/**'
    - '**/test/**'
    - '**/tests/**'
    - '**/fixtures/**'
    - '**/__fixtures__/**'
    - '**/__mocks__/**'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/*.snap'
    - '**/*.md'
    - '**/*.mdx'
    - '**/target/**'
    - '**/dist/**'
    - '**/build/**'
    - '**/node_modules/**'
    - '**/generated/**'
  PRODUCTION_FILE_POLICY: >-
    Review only the supplied changed production implementation and runtime
    configuration files. Do not inspect or review tests, specs, fixtures, mocks,
    snapshots, docs, generated output, vendored code, build output, or unrelated
    files. If a file is ambiguous, skip it and report it as skipped.
  FIXABLE_SEVERITIES:
    - high
    - medium
  SEVERITY_RUBRIC: >-
    high: likely security vulnerability, data loss/corruption, severe outage, or
    broad critical-path break. medium: reproducible functional regression or
    materially harmful reliability/performance issue with meaningful user
    impact. low: minor/narrow impact. nit: style/readability preference.
    opinionated: subjective alternative without a demonstrated defect.

steps:
  - name: initialize_checkout_state
    type: data.set
    with:
      checkout: ${{ inputs.existing_checkout }}

  - name: checkout_when_not_provided
    type: if
    condition: "${{ inputs.existing_checkout.project == nil }}"
    steps:
      - name: checkout_project
        type: workflow.execute
        with:
          workflow-id: checkout-kibana-project
          inputs:
            kibana_target: '{{ inputs.kibana_target }}'
            project_name: '{{ consts.REVIEW_PROJECT }}'
            target_depth: 256
            additional_branches:
              - repository: '{{ consts.UPSTREAM_KIBANA_REPO }}'
                branch: '{{ inputs.base_branch }}'
                ref: 'refs/remotes/workflow-review/{{ inputs.base_branch }}'
                depth: 256

      - name: save_checkout_state
        type: data.set
        with:
          checkout: ${{ steps.checkout_project.output }}

  - name: detect_target
    type: ssh.python
    connector-id: dev-vm
    with:
      env:
        KIBANA_TARGET: '{{ inputs.kibana_target }}'
      code: |
        import sys
        sys.path.insert(0, '/etc/dev-env-scripts')
        from detect_target import detect_target
        return detect_target()

  - name: prepare_review
    type: ssh.python
    connector-id: dev-vm
    with:
      cwd: '{{ variables.checkout.source_dir }}'
      env:
        BASE_BRANCH: '{{ inputs.base_branch }}'
        BASE_REF: 'refs/remotes/workflow-review/{{ inputs.base_branch }}'
        BASE_DEPTH: '256'
        MAX_HISTORY_DEPTH: '4096'
        PROJECT: '{{ variables.checkout.project }}'
        SOURCE_REPOSITORY: '{{ variables.checkout.source_repository }}'
        SOURCE_BRANCH: '{{ variables.checkout.source_branch }}'
        UPSTREAM_REPO: '{{ consts.UPSTREAM_KIBANA_REPO }}'
        INCLUDE_GLOBS: '{{ consts.PRODUCTION_FILE_INCLUDE_GLOBS | json }}'
        EXCLUDE_GLOBS: '{{ consts.PRODUCTION_FILE_EXCLUDE_GLOBS | json }}'
        MAX_FILES: '{{ consts.MAX_PRODUCTION_FILES }}'
        MAX_DIFF_CHARS: '{{ consts.MAX_DIFF_CHARS }}'
      code: |
        import sys
        sys.path.insert(0, '/etc/dev-env-scripts')
        from prepare_review import prepare_review
        return prepare_review()

  - name: initialize_review_state
    type: data.set
    with:
      pr_comments: []
      pr_comment_analysis: []
      pr_context: {}
      code_findings: []
      agent_session_id: '{{ inputs.session_id | default: "" }}'
      run_summary: '{{ inputs.run_summary | default: "" }}'

  - name: review_code
    type: workflow.execute
    with:
      workflow-id: main-kibana-agent
      inputs:
        cwd: '{{ variables.checkout.source_dir }}'
        disallow_shell: true
        idempotency_key: 'review-code-v1:{{ steps.prepare_review.output.head_commit }}:{{ steps.prepare_review.output.base_commit }}:{{ steps.prepare_review.output.production_diff_sha256 }}'
        session_id: '{{ variables.agent_session_id }}'
        run_summary: '{{ variables.run_summary }}'
        prompt: >-
          Review the current working-tree diff against base commit
          {{ steps.prepare_review.output.base_commit }} for head
          {{ steps.prepare_review.output.head_commit }}. Follow this policy:
          {{ consts.PRODUCTION_FILE_POLICY }} The production files are
          {{ steps.prepare_review.output.production_files | json }}. Review only
          the production diff stored at
          `{{ steps.prepare_review.output.production_diff_path }}` ({{ steps.prepare_review.output.production_diff_chars }} characters).
          Read that patch file with your file-reading tool; do not use shell.
          Apply this rubric: {{ consts.SEVERITY_RUBRIC }}. Report findings at
          every severity, not only fixable severities. Do not edit files. Return
          JSON with response, run_summary, findings, and changes. Each finding
          must contain severity, comment, file, line, and evidence. The comment
          should concisely state the defect and why it matters. Record skipped
          ambiguous files.

  - name: save_code_review_state
    type: data.set
    with:
      agent_session_id: '{{ steps.review_code.output.session_id }}'
      run_summary: '{{ steps.review_code.output.run_summary }}'
      code_findings: ${{ steps.review_code.output.findings }}

  - name: process_pr_comments
    type: if
    condition: "${{ steps.detect_target.output.is_pr == true and inputs.analyze_pr_comments == true }}"
    steps:
      - name: analyze_pr_comments
        type: workflow.execute
        with:
          workflow-id: analyze-kibana-pr-comments
          inputs:
            source_dir: '{{ variables.checkout.source_dir }}'
            owner: '{{ steps.detect_target.output.owner }}'
            repo: '{{ steps.detect_target.output.repo }}'
            number: ${{ steps.detect_target.output.number }}
            session_id: '{{ variables.agent_session_id }}'
            run_summary: '{{ variables.run_summary }}'

      - name: save_pr_review_state
        type: data.set
        with:
          agent_session_id: '{{ steps.analyze_pr_comments.output.session_id }}'
          run_summary: '{{ steps.analyze_pr_comments.output.run_summary }}'
          pr_comments: ${{ steps.analyze_pr_comments.output.comments }}
          pr_context: ${{ steps.analyze_pr_comments.output.pr_context }}
          pr_comment_analysis: ${{ steps.analyze_pr_comments.output.analysis }}

  - name: run_project_tests
    type: workflow.execute
    with:
      workflow-id: run-kibana-unit-tests
      inputs:
        source_dir: '{{ variables.checkout.source_dir }}'
        projects: ${{ steps.prepare_review.output.changed_projects }}
        diagnostic_chars: ${{ consts.MAX_AGENT_DIAGNOSTIC_CHARS }}

  - name: summarize_review
    type: ssh.python
    connector-id: dev-vm
    with:
      env:
        FIXABLE_SEVERITIES: '{{ consts.FIXABLE_SEVERITIES | json }}'
        CODE_FINDINGS_JSON: '{{ variables.code_findings | json }}'
        PR_COMMENTS_JSON: '{{ variables.pr_comments | json }}'
        PR_ANALYSIS_JSON: '{{ variables.pr_comment_analysis | json }}'
        TEST_FAILURES_JSON: '{{ steps.run_project_tests.output.failed | json }}'
      code: |
        import sys
        sys.path.insert(0, '/etc/dev-env-scripts')
        from summarize_review import summarize_review
        return summarize_review()

  - name: output
    type: workflow.output
    with:
      project: '{{ variables.checkout.project }}'
      target: '{{ variables.checkout.target }}'
      commit: '{{ variables.checkout.commit }}'
      source_repository: '{{ variables.checkout.source_repository }}'
      source_branch: '{{ variables.checkout.source_branch }}'
      source_dir: '{{ variables.checkout.source_dir }}'
      checkout_changed: '{{ variables.checkout.checkout_changed }}'
      clone_skipped: '{{ variables.checkout.clone_skipped }}'
      fetched_branches: '{{ variables.checkout.fetched_branches }}'
      base_commit: '{{ steps.prepare_review.output.base_commit }}'
      production_diff_path: '{{ steps.prepare_review.output.production_diff_path }}'
      production_files: ${{ steps.prepare_review.output.production_files }}
      changed_files: ${{ steps.prepare_review.output.changed_files }}
      changed_projects: ${{ steps.prepare_review.output.changed_projects }}
      is_pr: ${{ steps.detect_target.output.is_pr }}
      pr_target: ${{ steps.detect_target.output }}
      pr_context: ${{ variables.pr_context }}
      pr_comment_analysis: ${{ variables.pr_comment_analysis }}
      agent_comments_to_fix: ${{ steps.summarize_review.output.agent_comments_to_fix }}
      other_agent_comments: ${{ steps.summarize_review.output.other_agent_comments }}
      pr_comments_to_fix: ${{ steps.summarize_review.output.pr_comments_to_fix }}
      pr_comments_fixed_locally: ${{ steps.summarize_review.output.pr_comments_fixed_locally }}
      other_pr_comments: ${{ steps.summarize_review.output.other_pr_comments }}
      failed_tests: ${{ steps.summarize_review.output.failed_tests }}
      test_results: ${{ steps.run_project_tests.output.results }}
      needs_work: ${{ steps.summarize_review.output.needs_work }}
      session_id: '{{ variables.agent_session_id }}'
      run_summary: '{{ variables.run_summary }}'