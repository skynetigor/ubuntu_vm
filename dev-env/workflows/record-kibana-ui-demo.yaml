version: '1'
name: Record Kibana UI Demo
description: >-
  Starts a Scout test server for a Kibana checkout and records one short video
  of the issue in the browser with agent-browser: phase `before` shows the
  problem or the missing feature, phase `after` shows the change working. A
  failed recording never fails the run; check status in the output.
enabled: true
tags:
  - kibana
  - ui
  - video

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - source_dir
        - issue
        - test_plan
        - phase
        - output_path
      properties:
        source_dir:
          type: string
          description: Kibana source root on dev-vm, e.g. /opt/<project>/kibana/src. Must be bootstrapped.
        issue:
          type: object
          description: Issue the recording is about (number, title, url).
        test_plan:
          type: string
          description: Ordered browser steps with expected results.
        phase:
          type: string
          enum:
            - before
            - after
        output_path:
          type: string
          pattern: '^/tmp/[A-Za-z0-9_./-]+\.(webm|mp4|mov)$'
          description: Absolute path of the video file to write.
        run_summary:
          type: string
          default: ''

# Same literal key as the other heavy dev-vm jobs: Scout and the browser use the same ports and memory.
settings:
  timeout: 2h
  concurrency:
    key: dev-vm-node-heavy
    strategy: queue
    max: 1

consts:
  LIGHT_AGENT_MODEL: sonnet

steps:
  - name: initialize_state
    type: data.set
    with:
      kibana_url: ''
      status: failed
      caption: ''

  - name: start_scout
    type: ssh.run
    connector-id: dev-vm
    timeout: 45m
    on-failure:
      continue: true
    with:
      env:
        SOURCE_DIR: '{{ inputs.source_dir }}'
      command: |
        mkdir -p "$(dirname '{{ inputs.output_path }}')"
        rm -f '{{ inputs.output_path }}'
        bash /etc/dev-env-scripts/start_scout_server.sh

  - name: save_scout_state
    type: data.set
    with:
      kibana_url: '{{ steps.start_scout.output.kibana_url }}'

  - name: record_when_started
    type: if
    condition: "${{ variables.kibana_url != '' }}"
    steps:
      - name: record_video
        type: workflow.execute
        on-failure:
          continue: true
        with:
          workflow-id: main-kibana-agent
          inputs:
            cwd: '{{ inputs.source_dir }}'
            disallow_shell: false
            model: '{{ consts.LIGHT_AGENT_MODEL }}'
            run_summary: '{{ inputs.run_summary }}'
            prompt: >-
              Record one short screen video (about 30 to 60 seconds) of this
              work in a real browser: {{ inputs.issue.title }}. A Scout test server is
              already running at {{ variables.kibana_url }}. Use the
              `agent-browser` CLI (see the agent-browser skill), start its
              recording before the first action, and stop it when you are done,
              so the file is saved at `{{ inputs.output_path }}`. Move at a
              pace a viewer can follow and keep the final state on screen for a
              second or two.
              {% if inputs.phase == 'before' %}
              This is the BEFORE video: the code is unchanged. Show the
              reported problem, or show that the requested feature is not
              there.
              {% else %}
              This is the AFTER video: the change is implemented. Show the same
              flow as before, now working as the issue asks.
              {% endif %}
              Test plan (follow it): {{ inputs.test_plan }}
              Do not edit, create or delete repository files, do not run git
              write commands, and do not start, stop or restart servers. Close
              the browser when finished. Return JSON with response,
              run_summary, changes (empty list) and findings: exactly one entry
              with caption, one plain sentence describing what the video shows
              (no emojis, no marketing words).

      - name: save_recording
        type: data.set
        with:
          caption: '{{ steps.record_video.output.findings[0].caption }}'

      - name: check_video_file
        type: ssh.run
        connector-id: dev-vm
        on-failure:
          continue: true
        with:
          command: |
            if [ -s '{{ inputs.output_path }}' ]; then
              printf '{"exists":true,"bytes":%s}' "$(stat -c %s '{{ inputs.output_path }}')" > "$STEP_OUTPUT"
            else
              printf '{"exists":false,"bytes":0}' > "$STEP_OUTPUT"
            fi

      - name: save_status
        type: data.set
        with:
          status: "{% if steps.check_video_file.output.exists == true %}recorded{% else %}failed{% endif %}"

  # Runs after any start or recording failure so Scout never outlives this workflow.
  - name: stop_scout
    type: ssh.run
    connector-id: dev-vm
    with:
      command: bash /etc/dev-env-scripts/stop_scout_server.sh

  - name: output
    type: workflow.output
    with:
      status: '{{ variables.status }}'
      phase: '{{ inputs.phase }}'
      path: '{{ inputs.output_path }}'
      caption: '{{ variables.caption }}'
