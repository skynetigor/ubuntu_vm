version: '1'
name: Deploy Kibana Preview
description: |
  Resolves a GitHub PR / branch / commit URL, then runs
  clone → bootstrap → compile → docker compose up inside the dev-vm.
  Ports are auto-assigned from 5003-5999 and reused on re-deploy.
  The Kibana container handles post-start setup: waits for readiness,
  runs kibana-init, then uploads connectors and workflows.
tags:
  - kibana
  - preview
  - deploy
  - remote-host

settings:
  concurrency:
    key: '{{workflow.id}}'
    strategy: queue

consts:
  UBUNTU_VM_REPO: https://github.com/skynetigor/ubuntu_vm.git
  UBUNTU_VM_BRANCH: main
  # Preview Kibanas run in DinD inside the dev-vm, so they cannot resolve the
  # `apm-server` compose service name. Reach it via the host LAN IP where
  # port 8200 is published.
  APM_SERVER_URL: http://192.168.1.7:8200
  INTERNAL_PREVIEWS_HOST: dev-vm

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - kibana_target
      properties:
        kibana_target:
          type: string
          description: |
            GitHub URL to deploy. Accepted formats:
              PR     — https://github.com/<owner>/<repo>/pull/<number>
              Branch — https://github.com/<owner>/<repo>/tree/<branch>
              Commit — https://github.com/<owner>/<repo>/commit/<sha>
          default: https://github.com/elastic/kibana/tree/main
        kibana_config:
          type: object
          description: |
            Optional Kibana config overrides in YAML format. Keys here take
            precedence over the defaults in kibana.dev.yml. Example:
              xpack.fleet.enabled: false
              logging.root.level: debug
          default: {
            "uiSettings.globalOverrides": {
              "workflowsManagement:library:enabled": true,
              "workflowsManagement:globalExecutionsView:enabled": true
            },
          }
        elastic_password:
          type: string
          description: Password for the elastic user. Defaults to a pre-generated UUID.
          default: "1ab1db3e-838a-4b1e-9944-88084c553998"
        workflows_group:
          type: string
          description: |
            Subdirectory under kibana/workflows/ to mount into the preview as the
            workflows library. The resolved path is:
            <deploy_dir>/kibana/workflows/<workflows_group>
          enum:
            - scheduled
            - sanity
            - benchmark_no_op
            - none
          default: "scheduled"
        es_target:
          type: string
          description: |
            GitHub URL for the Elasticsearch branch or commit to build. Formats:
              Branch — https://github.com/<owner>/<repo>/tree/<branch>
              Commit — https://github.com/<owner>/<repo>/commit/<sha>
          default: https://github.com/elastic/elasticsearch/tree/main
        ttl_days:
          type: integer
          description: |
            Number of days after which the cleanup workflow will tear down this
            preview. The clock resets on every redeploy (updated_at is refreshed).
          default: 3
          minimum: 1

steps:
  - name: ensure_deployments_index
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: /deployed-previews
      body:
        mappings:
          dynamic: false
          properties:
            '@timestamp':
              type: date
            updated_at:
              type: date
            target:
              type: keyword
            port:
              type: integer
            public_url:
              type: keyword
            container_name:
              type: keyword
            deploy_dir:
              type: keyword
            es_internal_url:
              type: keyword
            es_user:
              type: keyword
            es_password:
              type: keyword
            ttl_days:
              type: integer
            es_port:
              type: integer

  # ── Step 1: Resolve target URL → commit / project name ───────────────────
  # Output: { PROJECT, KIBANA_COMMIT }
  - name: resolve
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        KIBANA_TARGET: '{{ inputs.kibana_target }}'
        UBUNTU_VM_REPO: '{{ consts.UBUNTU_VM_REPO }}'
        UBUNTU_VM_BRANCH: '{{ consts.UBUNTU_VM_BRANCH }}'
      code: |
        SCRIPTS_CACHE="/opt/ubuntu_vm"

        if [ -d "$SCRIPTS_CACHE/.git" ]; then
          git -C "$SCRIPTS_CACHE" fetch --depth 1 origin "$UBUNTU_VM_BRANCH"
          git -C "$SCRIPTS_CACHE" reset --hard FETCH_HEAD
        else
          sudo mkdir -p "$SCRIPTS_CACHE" && sudo chown kibana:kibana "$SCRIPTS_CACHE"
          git clone --depth 1 --branch "$UBUNTU_VM_BRANCH" "$UBUNTU_VM_REPO" "$SCRIPTS_CACHE"
        fi

        source "$SCRIPTS_CACHE/kibana/scripts/resolve.sh"
        python3 - "$PROJECT" "$KIBANA_COMMIT" > "$STEP_OUTPUT" <<'PY'
        import json
        import sys

        json.dump({
          "PROJECT": sys.argv[1],
          "KIBANA_COMMIT": sys.argv[2],
        }, sys.stdout)
        PY

  # ── Step 2: Set up per-deployment dir ────────────────────────────────────
  - name: setup_deployment
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        PROJECT: '{{ steps.resolve.output.PROJECT }}'
        DEPLOY_DIR: '/opt/{{ steps.resolve.output.PROJECT }}'
        UBUNTU_VM_REPO: '{{ consts.UBUNTU_VM_REPO }}'
        UBUNTU_VM_BRANCH: '{{ consts.UBUNTU_VM_BRANCH }}'
      code: |
        sudo mkdir -p "$DEPLOY_DIR"
        sudo chown kibana:kibana "$DEPLOY_DIR"
        sudo mkdir -p /opt/kibana-cache
        sudo chown kibana:kibana /opt/kibana-cache

        if [ -d "$DEPLOY_DIR/.git" ]; then
          echo "=== Updating ubuntu_vm in $DEPLOY_DIR ($UBUNTU_VM_BRANCH) ==="
          git -C "$DEPLOY_DIR" fetch --depth 1 origin "$UBUNTU_VM_BRANCH"
          git -C "$DEPLOY_DIR" reset --hard FETCH_HEAD
        else
          echo "=== Cloning ubuntu_vm into $DEPLOY_DIR ($UBUNTU_VM_BRANCH) ==="
          git clone --depth 1 --branch "$UBUNTU_VM_BRANCH" "$UBUNTU_VM_REPO" "$DEPLOY_DIR"
        fi
        echo "=== ubuntu_vm at $(git -C "$DEPLOY_DIR" rev-parse HEAD) ==="

  # ── Step 3: Look up existing ports from deployment index ─────────────────
  - name: fetch_deployment
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /deployed-previews/_doc/{{ steps.resolve.output.PROJECT }}

  # ── Step 4: Assign ports for this project ────────────────────────────────
  # Output: { ES_PORT, KIBANA_PORT }
  - name: assign_ports
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        PROJECT: '{{ steps.resolve.output.PROJECT }}'
        EXISTING_ES_PORT: '{{ steps.fetch_deployment.output._source.es_port | default: "" }}'
        EXISTING_KIBANA_PORT: '{{ steps.fetch_deployment.output._source.port | default: "" }}'
      code: |
        find_free_port() {
          local start=$1
          for port in $(seq "$start" 5998); do
            if ! ss -tlnp 2>/dev/null | grep -q ":${port}[^0-9]"; then
              echo "$port"
              return 0
            fi
          done
          echo "ERROR: no free port found from $start" >&2
          return 1
        }

        port_free() {
          ! ss -tlnp 2>/dev/null | grep -q ":${1}[^0-9]"
        }

        if [ -n "$EXISTING_ES_PORT" ] && [ -n "$EXISTING_KIBANA_PORT" ]; then
          if port_free "$EXISTING_ES_PORT" && port_free "$EXISTING_KIBANA_PORT"; then
            ES_PORT=$EXISTING_ES_PORT
            KIBANA_PORT=$EXISTING_KIBANA_PORT
            echo "=== Reusing ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
          else
            echo "=== Saved ports for $PROJECT conflict (ES=$EXISTING_ES_PORT, Kibana=$EXISTING_KIBANA_PORT taken), reassigning ==="
            ES_PORT=$(find_free_port 5003)
            KIBANA_PORT=$(find_free_port $((ES_PORT + 1)))
            echo "=== Reassigned ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
          fi
        else
          ES_PORT=$(find_free_port 5003)
          KIBANA_PORT=$(find_free_port $((ES_PORT + 1)))
          echo "=== Assigned ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
        fi

        python3 - "$ES_PORT" "$KIBANA_PORT" > "$STEP_OUTPUT" <<'PY'
        import json
        import sys

        json.dump({
          "ES_PORT": int(sys.argv[1]),
          "KIBANA_PORT": int(sys.argv[2]),
        }, sys.stdout)
        PY

  # ── Step 4: Write kibana/.env from resolved values, ports, and env vars ───
  # Output: { CF_SUBDOMAIN, KIBANA_PUBLIC_URL }
  - name: write_env
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        PROJECT: '{{ steps.resolve.output.PROJECT }}'
        DEPLOY_DIR: '/opt/{{ steps.resolve.output.PROJECT }}'
        KIBANA_TARGET: '{{ inputs.kibana_target }}'
        KIBANA_COMMIT: '{{ steps.resolve.output.KIBANA_COMMIT }}'
        ES_TARGET: '{{ inputs.es_target }}'
        ES_PORT: '{{ steps.assign_ports.output.ES_PORT }}'
        KIBANA_PORT: '{{ steps.assign_ports.output.KIBANA_PORT }}'
        ES_PASSWORD: '{{ inputs.elastic_password }}'
        APM_SERVER_URL: '{{ consts.APM_SERVER_URL }}'
      code: |
        CF_SUBDOMAIN=$(echo "$PROJECT" \
          | tr '[:upper:]/' '[:lower:]-' \
          | sed 's/[^a-z0-9-]/-/g' \
          | cut -c1-20)
        CF_SERVICE_URL="http://dev-vm:${KIBANA_PORT}"

        if [ -n "${CF_DOMAIN:-}" ]; then
          KIBANA_PUBLIC_URL="https://${CF_SUBDOMAIN}.${CF_DOMAIN}"
        else
          KIBANA_PUBLIC_URL=""
        fi

        mkdir -p "$DEPLOY_DIR/kibana/env"

        {
          echo "KIBANA_TARGET=${KIBANA_TARGET}"
          echo "KIBANA_COMMIT=${KIBANA_COMMIT}"
          echo "ES_TARGET=${ES_TARGET}"
          echo "ES_PORT=${ES_PORT}"
          echo "KIBANA_PORT=${KIBANA_PORT}"
          echo "KIBANA_PUBLIC_URL=${KIBANA_PUBLIC_URL:-}"
          echo "ES_PASSWORD=$ES_PASSWORD"
          echo "KIBANA_SRC=$DEPLOY_DIR/kibana/src"
          echo "KIBANA_DIST=$DEPLOY_DIR/kibana/dist"
          echo "SCRIPTS_DIR=$DEPLOY_DIR/kibana/scripts"
          echo "ELASTIC_APM_ACTIVE=true"
          echo "ELASTIC_APM_SERVER_URL=$APM_SERVER_URL"
          echo "ELASTIC_APM_SERVICE_NAME=kibana-preview-${PROJECT}"
          echo "ELASTIC_APM_CONTEXT_PROPAGATION_ONLY=false"
          echo "ELASTIC_APM_SECRET_TOKEN="
        } > "$DEPLOY_DIR/kibana/env/.env"
        echo "=== .env written ==="

        python3 - "$CF_SUBDOMAIN" "$KIBANA_PUBLIC_URL" > "$STEP_OUTPUT" <<'PY'
        import json
        import sys

        json.dump({
          "CF_SUBDOMAIN": sys.argv[1],
          "KIBANA_PUBLIC_URL": sys.argv[2],
        }, sys.stdout)
        PY

  # ── Step 5: Write user Kibana config overrides → KIBANA_CONFIG_OVERRIDES_B64
  - name: write_kibana_config
    type: remoteHost.javascript
    connector-id: dev-vm
    with:
      env:
        DEPLOY_DIR: '/opt/{{ steps.resolve.output.PROJECT }}'
      code: |
        const fs = require("fs");
        const cfg = {{ inputs.kibana_config | json }} || {};
        const envFile = `${process.env.DEPLOY_DIR}/kibana/env/.env`;

        function toYaml(obj, depth) {
          const pad = "  ".repeat(depth);
          return Object.entries(obj).map(([k, v]) => {
            if (v === null || v === undefined) return pad + k + ": ~";
            if (Array.isArray(v)) {
              const items = v.map(item =>
                typeof item === "object" && item !== null
                  ? pad + "-\n" + toYaml(item, depth + 1)
                  : pad + "- " + item
              );
              return pad + k + ":\n" + items.join("\n");
            }
            if (typeof v === "object") return pad + k + ":\n" + toYaml(v, depth + 1);
            return pad + k + ": " + v;
          }).join("\n");
        }

        const entries = Object.entries(cfg);
        if (entries.length) {
          const yaml = toYaml(cfg, 0);
          const b64 = Buffer.from(yaml).toString("base64");
          fs.appendFileSync(envFile, "KIBANA_CONFIG_OVERRIDES_B64=" + b64 + "\n");
          console.log("=== kibana.user.yml: " + entries.length + " top-level key(s) ===");
          console.log(yaml);
        } else {
          console.log("=== kibana.user.yml: no overrides ===");
        }

  # ── Step 6: Clone Kibana source ──────────────────────────────────────────
  - name: clone
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        DEPLOY_DIR: '/opt/{{ steps.resolve.output.PROJECT }}'
        KIBANA_SRC: '/opt/{{ steps.resolve.output.PROJECT }}/kibana/src'
        KIBANA_TARGET: '{{ inputs.kibana_target }}'
        KIBANA_COMMIT: '{{ steps.resolve.output.KIBANA_COMMIT }}'
      code: |
        bash "$DEPLOY_DIR/kibana/scripts/clone.sh"

  # ── Step 7: Bootstrap dependencies ───────────────────────────────────────
  - name: bootstrap
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        DEPLOY_DIR: '/opt/{{ steps.resolve.output.PROJECT }}'
        KIBANA_SRC: '/opt/{{ steps.resolve.output.PROJECT }}/kibana/src'
        KIBANA_COMMIT: '{{ steps.resolve.output.KIBANA_COMMIT }}'
      code: |
        CACHE_DIR="/opt/kibana-cache/$KIBANA_COMMIT"
        if [ -d "$CACHE_DIR/node_modules" ]; then
          echo "=== Cache hit — symlinking node_modules ($KIBANA_COMMIT) ==="
          ln -sfn "$CACHE_DIR/node_modules" "$KIBANA_SRC/node_modules"
        else
          bash "$DEPLOY_DIR/kibana/scripts/bootstrap.sh"
          mkdir -p "$CACHE_DIR"
          cp -al "$KIBANA_SRC/node_modules" "$CACHE_DIR/node_modules"
        fi

  # ── Step 8: Compile / build distribution ─────────────────────────────────
  - name: compile
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        DEPLOY_DIR: '/opt/{{ steps.resolve.output.PROJECT }}'
        KIBANA_SRC: '/opt/{{ steps.resolve.output.PROJECT }}/kibana/src'
        KIBANA_COMMIT: '{{ steps.resolve.output.KIBANA_COMMIT }}'
      code: |
        CACHE_DIR="/opt/kibana-cache/$KIBANA_COMMIT"
        if [ -d "$CACHE_DIR/dist" ]; then
          echo "=== Cache hit — hard-linking dist ($KIBANA_COMMIT) ==="
          rm -rf "$DEPLOY_DIR/kibana/dist"
          cp -al "$CACHE_DIR/dist" "$DEPLOY_DIR/kibana/dist"
        else
          bash "$DEPLOY_DIR/kibana/scripts/compile.sh"
          mkdir -p "$CACHE_DIR"
          cp -al "$KIBANA_SRC/dist" "$CACHE_DIR/dist"
          cp -al "$KIBANA_SRC/dist" "$DEPLOY_DIR/kibana/dist"
        fi

  # ── Step 9: Start the stack ───────────────────────────────────────────────
  - name: start
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        PROJECT: '{{ steps.resolve.output.PROJECT }}'
      cwd: '/opt/{{ steps.resolve.output.PROJECT }}/kibana'
      code: |
        docker compose --env-file env/.env -p "$PROJECT" up --build --wait kibana
        echo "=== Stack started (project: $PROJECT) ==="
        docker compose -p "$PROJECT" ps

  # ── Step 10: Index deployment record in deployed-previews ───────────────────
  - name: index_deployment
    type: elasticsearch.request
    with:
      method: PUT
      path: /deployed-previews/_doc/{{ steps.resolve.output.PROJECT }}
      body:
        '@timestamp': '{{ "now" | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
        updated_at: '{{ "now" | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
        target: '{{ inputs.kibana_target }}'
        port: '{{ steps.assign_ports.output.KIBANA_PORT }}'
        es_port: '{{ steps.assign_ports.output.ES_PORT }}'
        public_url: '{{ steps.write_env.output.KIBANA_PUBLIC_URL }}'
        container_name: '{{ steps.resolve.output.PROJECT }}'
        deploy_dir: '/opt/{{ steps.resolve.output.PROJECT }}'
        es_internal_url: http://{{ consts.INTERNAL_PREVIEWS_HOST }}:{{ steps.assign_ports.output.ES_PORT }}
        es_user: elastic
        es_password: '{{ inputs.elastic_password }}'
        ttl_days: '{{ inputs.ttl_days }}'

  # ── Step 11: Upload workflows to Kibana ──────────────────────────────────
  - name: upload_workflows
    type: remoteHost.runCommand
    connector-id: dev-vm
    if: '${{ inputs.workflows_group != "none" }}'
    on-failure:
      continue: true
    with:
      env:
        WORKFLOWS_DIR: '/opt/{{ steps.resolve.output.PROJECT }}/kibana/workflows/{{ inputs.workflows_group }}'
        KIBANA_URL: 'http://localhost:{{ steps.assign_ports.output.KIBANA_PORT }}'
        KIBANA_USERNAME: elastic
        ES_PASSWORD: '{{ inputs.elastic_password }}'
      cwd: '/opt/{{ steps.resolve.output.PROJECT }}/kibana/scripts'
      code: |
        npm install --omit=dev --silent
        node upload_workflows.js

  # ── Step 12: Register Cloudflare tunnel ingress ──────────────────────────
  - name: register_tunnel
    type: remoteHost.runCommand
    connector-id: dev-vm
    on-failure:
      continue: true
    with:
      env:
        CF_SUBDOMAIN: '{{ steps.write_env.output.CF_SUBDOMAIN }}'
        CF_SERVICE_URL: 'http://dev-vm:{{ steps.assign_ports.output.KIBANA_PORT }}'
      cwd: '/opt/{{ steps.resolve.output.PROJECT }}/kibana/scripts'
      code: |
        bash register-tunnel.sh

  # ── Step 13: Docker logs for kibana container ────────────────────────────
  - name: get_container_logs
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        PROJECT: '{{ steps.resolve.output.PROJECT }}'
      cwd: '/opt/{{ steps.resolve.output.PROJECT }}/kibana'
      code: |
        echo "=== Kibana container logs ==="
        docker compose -p "$PROJECT" logs --no-log-prefix kibana

  # ── Step 14: Output setup logs from inside the Kibana container ──────────
  - name: get_setup_logs
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        PROJECT: '{{ steps.resolve.output.PROJECT }}'
      cwd: '/opt/{{ steps.resolve.output.PROJECT }}/kibana'
      code: |
        CONTAINER=$(docker compose -p "$PROJECT" ps -q kibana)
        SETUP_DIR="/opt/kibana/setup"
        echo "=== setup.log ==="
        docker exec "$CONTAINER" cat "$SETUP_DIR/setup.log" 2>/dev/null || true
        echo ""
        echo "=== Per-step logs (${SETUP_DIR}/logs) ==="
        for f in $(docker exec "$CONTAINER" sh -c "ls ${SETUP_DIR}/logs/*.log 2>/dev/null || true"); do
          echo ""
          echo "──── $f ────"
          docker exec "$CONTAINER" cat "$f"
        done
        echo ""
        echo "=== End of logs ==="

  # ── Summary ───────────────────────────────────────────────────────────────
  - name: summary
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      env:
        PROJECT: '{{ steps.resolve.output.PROJECT }}'
        TARGET: '{{ inputs.kibana_target }}'
        KIBANA_COMMIT: '{{ steps.resolve.output.KIBANA_COMMIT }}'
        ES_PORT: '{{ steps.assign_ports.output.ES_PORT }}'
        KIBANA_PORT: '{{ steps.assign_ports.output.KIBANA_PORT }}'
        KIBANA_PUBLIC_URL: '{{ steps.write_env.output.KIBANA_PUBLIC_URL }}'
        ES_PASSWORD: '{{ inputs.elastic_password }}'
      code: |
        echo "═══════════════════════════════════════════"
        echo "  Kibana Preview Deployed"
        echo "═══════════════════════════════════════════"
        echo "  Target  : $TARGET"
        if [ -n "$KIBANA_COMMIT" ]; then
        echo "  Commit  : $KIBANA_COMMIT"
        fi

        echo "  ES      : localhost:$ES_PORT"
        echo "  Kibana  : $KIBANA_PUBLIC_URL"
        echo "  User    : elastic"
        echo "  Password: $ES_PASSWORD"
        echo "═══════════════════════════════════════════"

        python3 - "$PROJECT" "$TARGET" "$KIBANA_COMMIT" "$ES_PORT" "$KIBANA_PORT" \
          "$KIBANA_PUBLIC_URL" "$ES_PASSWORD" > "$STEP_OUTPUT" <<'PY'
        import json
        import sys

        project, target, commit, es_port, kibana_port, public_url, password = sys.argv[1:]
        json.dump({
            "project": project,
            "target": target,
            "commit": commit,
            "es_port": int(es_port),
            "kibana_port": int(kibana_port),
            "es_url": f"http://localhost:{es_port}",
            "kibana_url": f"http://localhost:{kibana_port}",
            "public_url": public_url,
            "es_user": "elastic",
            "es_password": password,
        }, sys.stdout)
        PY

  - name: output
    type: workflow.output
    with:
      kibana_internal_url: 'http://{{ consts.INTERNAL_PREVIEWS_HOST }}:{{ steps.summary.output.kibana_port }}'
      es_internal_url: 'http://{{ consts.INTERNAL_PREVIEWS_HOST }}:{{ steps.summary.output.es_port }}'
      es_user: '{{ steps.summary.output.es_user }}'
      es_password: '{{ steps.summary.output.es_password }}'
      project: '{{ steps.summary.output.project }}'
      target: '{{ steps.summary.output.target }}'
      commit: '{{ steps.summary.output.commit }}'
      public_url: '{{ steps.summary.output.public_url }}'
