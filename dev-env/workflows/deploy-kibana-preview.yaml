version: '1'
name: Deploy Kibana Preview
description: |
  Resolves a GitHub PR / branch / commit URL, then runs
  clone → bootstrap → compile → docker compose up inside the dev-vm.
  Ports are auto-assigned from 5003-5999 and reused on re-deploy.
  The Kibana container handles post-start setup: waits for readiness,
  runs kibana-init, then uploads connectors and workflows.
tags:
  - kibana
  - preview
  - deploy
  - remote-host

settings:
  concurrency:
    key: '{{workflow.id}}'
    strategy: queue

consts:
  UBUNTU_VM_REPO: https://github.com/skynetigor/ubuntu_vm.git
  UBUNTU_VM_BRANCH: main

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - kibana_target
      properties:
        kibana_target:
          type: string
          description: |
            GitHub URL to deploy. Accepted formats:
              PR     — https://github.com/<owner>/<repo>/pull/<number>
              Branch — https://github.com/<owner>/<repo>/tree/<branch>
              Commit — https://github.com/<owner>/<repo>/commit/<sha>
        kibana_config:
          type: object
          description: |
            Optional Kibana config overrides in YAML format. Keys here take
            precedence over the defaults in kibana.dev.yml. Example:
              xpack.fleet.enabled: false
              logging.root.level: debug
          default: {
            "uiSettings.globalOverrides:workflowsManagement:library:enabled": true
          }

steps:
  # ── Step 1: Clone / update the ubuntu_vm repo ────────────────────────────
  - name: update_ubuntu_vm
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        DEPLOY_DIR="/opt/deploy"
        UBUNTU_VM_REPO="{{ consts.UBUNTU_VM_REPO }}"
        UBUNTU_VM_BRANCH="{{ consts.UBUNTU_VM_BRANCH }}"

        for dir in /opt/deploy /opt/deploy-ports; do
          sudo mkdir -p "$dir"
          sudo chown kibana:kibana "$dir"
        done

        if [ -d "$DEPLOY_DIR/.git" ]; then
          echo "=== Updating ubuntu_vm ($UBUNTU_VM_BRANCH) ==="
          git -C "$DEPLOY_DIR" fetch --depth 1 origin "$UBUNTU_VM_BRANCH"
          git -C "$DEPLOY_DIR" reset --hard FETCH_HEAD
        else
          echo "=== Cloning ubuntu_vm ($UBUNTU_VM_BRANCH) ==="
          git clone --depth 1 --branch "$UBUNTU_VM_BRANCH" "$UBUNTU_VM_REPO" "$DEPLOY_DIR"
        fi
        echo "=== ubuntu_vm at $(git -C "$DEPLOY_DIR" rev-parse HEAD) ==="

  # ── Step 2: Resolve target URL → fork / branch / commit / project name ───
  # Output: { KIBANA_FORK, KIBANA_BRANCH, KIBANA_COMMIT, PROJECT }
  - name: resolve
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        TARGET="{{ inputs.kibana_target }}"

        if echo "$TARGET" | grep -qE 'github\.com/[^/]+/[^/]+/pull/[0-9]+'; then
          # ── PR URL ─────────────────────────────────────────────────────────
          OWNER=$(echo "$TARGET"  | sed -E 's|https://github\.com/([^/]+)/.*|\1|')
          REPO=$(echo "$TARGET"   | sed -E 's|https://github\.com/[^/]+/([^/]+)/.*|\1|')
          PR_NUM=$(echo "$TARGET" | sed -E 's|.*/pull/([0-9]+).*|\1|')

          echo "=== Resolving PR #$PR_NUM in $OWNER/$REPO ==="
          PR_JSON=$(curl -sf "https://api.github.com/repos/$OWNER/$REPO/pulls/$PR_NUM")
          if [ -z "$PR_JSON" ]; then
            echo "ERROR: GitHub API returned no data — check the PR URL"
            exit 1
          fi
          KIBANA_FORK=$(echo "$PR_JSON"   | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['head']['repo']['clone_url'])")
          KIBANA_BRANCH=$(echo "$PR_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['head']['ref'])")
          KIBANA_COMMIT=$(echo "$PR_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['head']['sha'])")
          PROJECT=$(echo "$KIBANA_BRANCH" \
            | tr '[:upper:]/' '[:lower:]-' \
            | sed 's/[^a-z0-9-]/-/g' \
            | cut -c1-50)

        elif echo "$TARGET" | grep -qE 'github\.com/[^/]+/[^/]+/tree/'; then
          # ── Branch URL ─────────────────────────────────────────────────────
          OWNER=$(echo "$TARGET" | sed -E 's|https://github\.com/([^/]+)/.*|\1|')
          REPO=$(echo "$TARGET"  | sed -E 's|https://github\.com/[^/]+/([^/]+)/.*|\1|')
          KIBANA_FORK="https://github.com/$OWNER/$REPO"
          KIBANA_BRANCH=$(echo "$TARGET" | sed -E "s|https://github\.com/[^/]+/[^/]+/tree/||")
          KIBANA_COMMIT=""
          PROJECT=$(echo "$KIBANA_BRANCH" \
            | tr '[:upper:]/' '[:lower:]-' \
            | sed 's/[^a-z0-9-]/-/g' \
            | cut -c1-50)

        elif echo "$TARGET" | grep -qE 'github\.com/[^/]+/[^/]+/commit/[0-9a-f]+'; then
          # ── Commit URL ─────────────────────────────────────────────────────
          OWNER=$(echo "$TARGET" | sed -E 's|https://github\.com/([^/]+)/.*|\1|')
          REPO=$(echo "$TARGET"  | sed -E 's|https://github\.com/[^/]+/([^/]+)/.*|\1|')
          KIBANA_FORK="https://github.com/$OWNER/$REPO"
          KIBANA_BRANCH=""
          KIBANA_COMMIT=$(echo "$TARGET" | sed -E 's|.*/commit/([0-9a-f]+).*|\1|')
          PROJECT="commit-${KIBANA_COMMIT:0:8}"

        else
          echo "ERROR: unrecognised URL — expected one of:"
          echo "  https://github.com/<owner>/<repo>/pull/<number>"
          echo "  https://github.com/<owner>/<repo>/tree/<branch>"
          echo "  https://github.com/<owner>/<repo>/commit/<sha>"
          exit 1
        fi

        if [ -z "$KIBANA_FORK" ] || [ -z "$PROJECT" ]; then
          echo "ERROR: resolve produced empty KIBANA_FORK or PROJECT — aborting"
          exit 1
        fi

        echo "=== Resolved: PROJECT=$PROJECT FORK=$KIBANA_FORK BRANCH=$KIBANA_BRANCH COMMIT=$KIBANA_COMMIT ==="

        SCRIPT_OUTPUT=$(printf '{"KIBANA_FORK":"%s","KIBANA_BRANCH":"%s","KIBANA_COMMIT":"%s","PROJECT":"%s"}' \
          "$KIBANA_FORK" "$KIBANA_BRANCH" "$KIBANA_COMMIT" "$PROJECT")

  # ── Step 3: Assign ports for this project ────────────────────────────────
  # Output: { ES_PORT, KIBANA_PORT }
  - name: assign_ports
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        PROJECT="{{ steps.resolve.output.PROJECT }}"
        PORT_FILE="/opt/deploy-ports/$PROJECT"

        find_free_port() {
          local start=$1
          for port in $(seq "$start" 5998); do
            if ! ss -tlnp 2>/dev/null | grep -q ":${port}[^0-9]"; then
              echo "$port"
              return 0
            fi
          done
          echo "ERROR: no free port found from $start" >&2
          return 1
        }

        if [ -f "$PORT_FILE" ]; then
          set -a; source "$PORT_FILE"; set +a
          echo "=== Reusing ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
        else
          ES_PORT=$(find_free_port 5003)
          KIBANA_PORT=$(find_free_port $((ES_PORT + 1)))
          printf 'ES_PORT=%s\nKIBANA_PORT=%s\n' "$ES_PORT" "$KIBANA_PORT" > "$PORT_FILE"
          echo "=== Assigned ports for $PROJECT: ES=$ES_PORT, Kibana=$KIBANA_PORT ==="
        fi

        SCRIPT_OUTPUT="{\"ES_PORT\":${ES_PORT},\"KIBANA_PORT\":${KIBANA_PORT}}"

  # ── Step 4: Write kibana/.env from resolved values, ports, and env vars ───
  # Output: { CF_SUBDOMAIN, KIBANA_PUBLIC_URL }
  - name: write_env
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        DEPLOY_DIR="/opt/deploy"
        KIBANA_FORK="{{ steps.resolve.output.KIBANA_FORK }}"
        KIBANA_BRANCH="{{ steps.resolve.output.KIBANA_BRANCH }}"
        KIBANA_COMMIT="{{ steps.resolve.output.KIBANA_COMMIT }}"
        ES_PORT="{{ steps.assign_ports.output.ES_PORT }}"
        KIBANA_PORT="{{ steps.assign_ports.output.KIBANA_PORT }}"

        CF_SUBDOMAIN=$(echo "{{ steps.resolve.output.PROJECT }}" \
          | tr '[:upper:]/' '[:lower:]-' \
          | sed 's/[^a-z0-9-]/-/g' \
          | cut -c1-20)
        CF_SERVICE_URL="http://dev-vm:${KIBANA_PORT}"

        if [ -n "${CF_DOMAIN:-}" ]; then
          KIBANA_PUBLIC_URL="https://${CF_SUBDOMAIN}.${CF_DOMAIN}"
        else
          KIBANA_PUBLIC_URL=""
        fi

        mkdir -p "$DEPLOY_DIR/kibana/env"

        {
          echo "KIBANA_FORK=${KIBANA_FORK}"
          echo "KIBANA_BRANCH=${KIBANA_BRANCH}"
          echo "KIBANA_COMMIT=${KIBANA_COMMIT}"
          echo "ES_PORT=${ES_PORT}"
          echo "KIBANA_PORT=${KIBANA_PORT}"
          echo "KIBANA_PUBLIC_URL=${KIBANA_PUBLIC_URL:-}"
          echo "ES_VERSION=${ES_VERSION:-9.6.0}"
          echo "ES_PASSWORD=${ES_PASSWORD:-changeme}"
        } > "$DEPLOY_DIR/kibana/env/.env"
        echo "=== .env written ==="

        SCRIPT_OUTPUT=$(printf '{"CF_SUBDOMAIN":"%s","KIBANA_PUBLIC_URL":"%s"}' \
          "$CF_SUBDOMAIN" "$KIBANA_PUBLIC_URL")

  # ── Step 5: Write user Kibana config overrides → kibana.user.yml ─────────
  - name: write_kibana_config
    type: remoteHost.runJavascript
    connector-id: dev-vm
    with:
      code: |
        const fs = require("fs");
        const cfg = {{ inputs.kibana_config }} || {};

        function toYaml(obj, depth) {
          const pad = "  ".repeat(depth);
          return Object.entries(obj).map(([k, v]) => {
            if (v === null || v === undefined) return pad + k + ": ~";
            if (Array.isArray(v)) {
              const items = v.map(item =>
                typeof item === "object" && item !== null
                  ? pad + "-\n" + toYaml(item, depth + 1)
                  : pad + "- " + item
              );
              return pad + k + ":\n" + items.join("\n");
            }
            if (typeof v === "object") return pad + k + ":\n" + toYaml(v, depth + 1);
            return pad + k + ": " + v;
          }).join("\n");
        }

        const entries = Object.entries(cfg);
        if (entries.length) {
          const yaml = toYaml(cfg, 0);
          const b64 = Buffer.from(yaml).toString("base64");
          fs.appendFileSync("/opt/deploy/kibana/env/.env", "KIBANA_CONFIG_OVERRIDES_B64=" + b64 + "\n");
          console.log("=== kibana.user.yml: " + entries.length + " top-level key(s) ===");
          console.log(yaml);
        } else {
          console.log("=== kibana.user.yml: no overrides ===");
        }

  # ── Step 6: Clone Kibana source ──────────────────────────────────────────
  - name: clone
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        export KIBANA_FORK="{{ steps.resolve.output.KIBANA_FORK }}"
        export KIBANA_BRANCH="{{ steps.resolve.output.KIBANA_BRANCH }}"
        export KIBANA_COMMIT="{{ steps.resolve.output.KIBANA_COMMIT }}"
        bash /opt/deploy/kibana/scripts/clone.sh

  # ── Step 6: Bootstrap dependencies ───────────────────────────────────────
  - name: bootstrap
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        bash /opt/deploy/kibana/scripts/bootstrap.sh

  # ── Step 7: Compile / build distribution ─────────────────────────────────
  - name: compile
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        bash /opt/deploy/kibana/scripts/compile.sh

  # ── Step 8: Start the stack ───────────────────────────────────────────────
  - name: start
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        PROJECT="{{ steps.resolve.output.PROJECT }}"
        KIBANA_DIR="/opt/deploy/kibana"
        set -a; source "$KIBANA_DIR/env/.env"; set +a
        docker compose -p "$PROJECT" -f "$KIBANA_DIR/docker-compose.yml" up --build -d
        echo "=== Stack started (project: $PROJECT) ==="
        docker compose -p "$PROJECT" ps

  # ── Step 9: Wait for Kibana to be ready ──────────────────────────────────
  - name: wait_for_kibana
    type: remoteHost.runCommand
    connector-id: dev-vm
    on-failure:
      continue: true
    with:
      code: |
        KIBANA_URL="http://localhost:{{ steps.assign_ports.output.KIBANA_PORT }}" \
          bash /opt/deploy/kibana/scripts/wait-kibana.sh

  # ── Step 10: Register Cloudflare tunnel ingress ──────────────────────────
  - name: register_tunnel
    type: remoteHost.runCommand
    connector-id: dev-vm
    on-failure:
      continue: true
    with:
      code: |
        CF_SUBDOMAIN="{{ steps.write_env.output.CF_SUBDOMAIN }}"
        CF_SERVICE_URL="http://dev-vm:{{ steps.assign_ports.output.KIBANA_PORT }}"
        bash /opt/deploy/kibana/scripts/register-tunnel.sh

  # ── Step 11: Docker logs for kibana container ────────────────────────────
  - name: get_container_logs
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        PROJECT="{{ steps.resolve.output.PROJECT }}"
        KIBANA_DIR="/opt/deploy/kibana"
        echo "=== Kibana container logs ==="
        docker compose -p "$PROJECT" -f "$KIBANA_DIR/docker-compose.yml" logs --no-log-prefix kibana

  # ── Step 11: Output setup logs from inside the Kibana container ──────────
  - name: get_setup_logs
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        PROJECT="{{ steps.resolve.output.PROJECT }}"
        KIBANA_DIR="/opt/deploy/kibana"
        CONTAINER=$(docker compose -p "$PROJECT" -f "$KIBANA_DIR/docker-compose.yml" ps -q kibana)
        SETUP_DIR="/opt/kibana/setup"
        echo "=== setup.log ==="
        docker exec "$CONTAINER" cat "$SETUP_DIR/setup.log" 2>/dev/null || true
        echo ""
        echo "=== Per-step logs (${SETUP_DIR}/logs) ==="
        for f in $(docker exec "$CONTAINER" sh -c "ls ${SETUP_DIR}/logs/*.log 2>/dev/null || true"); do
          echo ""
          echo "──── $f ────"
          docker exec "$CONTAINER" cat "$f"
        done
        echo ""
        echo "=== End of logs ==="

  # ── Summary ───────────────────────────────────────────────────────────────
  - name: summary
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        echo "═══════════════════════════════════════════"
        echo "  Kibana Preview Deployed"
        echo "═══════════════════════════════════════════"
        echo "  Target  : {{ inputs.kibana_target }}"
        echo "  Fork    : {{ steps.resolve.output.KIBANA_FORK }}"
        KIBANA_BRANCH="{{ steps.resolve.output.KIBANA_BRANCH }}"
        KIBANA_COMMIT="{{ steps.resolve.output.KIBANA_COMMIT }}"
        if [ -n "$KIBANA_BRANCH" ]; then
        echo "  Branch  : $KIBANA_BRANCH"
        fi
        if [ -n "$KIBANA_COMMIT" ]; then
        echo "  Commit  : $KIBANA_COMMIT"
        fi
        echo "  ES      : localhost:{{ steps.assign_ports.output.ES_PORT }}"
        echo "  Kibana  : http://192.168.1.7:{{ steps.assign_ports.output.KIBANA_PORT }}"
        KIBANA_PUBLIC_URL="{{ steps.write_env.output.KIBANA_PUBLIC_URL }}"
        if [ -n "$KIBANA_PUBLIC_URL" ]; then
        echo "  Public  : $KIBANA_PUBLIC_URL"
        fi
        echo "═══════════════════════════════════════════"
