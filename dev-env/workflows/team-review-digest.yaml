version: '1'
name: Team Review Digest
description: >-
  Every morning except Saturday (Sunday to Friday, 09:00 Europe/Rome), posts one message to the team channel with three groups:
  the team's own PRs still waiting for review, contributor PRs (authors outside
  the team) that need the workflows-eng code owner review, and the team's own
  approved PRs that are not merged yet. Automated PRs and PRs with no activity
  for a long time are only counted.
enabled: true
tags:
  - kibana
  - review
  - scheduled

triggers:
  - type: scheduled
    with:
      rrule:
        freq: WEEKLY
        interval: 1
        byweekday: [SU, MO, TU, WE, TH, FR]
        byhour: [9]
        byminute: [0]
        tzid: Europe/Rome
  - type: manual
    inputs:
      additionalProperties: false
      properties:
        max_age_days:
          type: integer
          default: 60
          minimum: 1
          description: Pending PRs with no activity for this long are counted, not listed.
        max_team_prs:
          type: integer
          default: 10
          minimum: 1
          description: Most one-workflow team PRs listed, longest waiting first.
        max_approved_prs:
          type: integer
          default: 5
          minimum: 1
          description: Most approved-but-unmerged PRs listed, mergeable ones first.
        max_contributor_prs:
          type: integer
          default: 5
          minimum: 1
          description: Most contributor PRs listed, the most relevant first.
        post:
          type: boolean
          default: true
          description: False only builds the message and returns it in the output.
        test_channel:
          type: boolean
          default: false
          description: Post through the Slack bot to #test-channel instead of the team webhook.

# A run still going when the next one starts makes that one a no-op.
settings:
  timeout: 30m
  concurrency:
    key: '{{ workflow.id }}'
    strategy: drop
    max: 1

consts:
  REPOSITORY: elastic/kibana
  # GitHub team whose pending reviews are listed; it owns the workflows packages in CODEOWNERS.
  TEAM: elastic/workflows-eng
  # Members of that team: their approved-but-unmerged PRs are the second group.
  TEAM_MEMBERS:
    - dej611
    - yngrdyn
    - Kiryous
    - h88
    - shahargl
    - semd
    - skynetigor
    - tinnytintin10
    - rosomri
    - talboren
  BOT_AUTHORS:
    - kibanamachine

steps:
  - name: collect_digest
    type: ssh.python
    connector-id: dev-vm
    timeout: 15m
    with:
      env:
        REPOSITORY: '{{ consts.REPOSITORY }}'
        TEAM: '{{ consts.TEAM }}'
        AUTHORS_JSON: '{{ consts.TEAM_MEMBERS | json }}'
        BOT_AUTHORS_JSON: '{{ consts.BOT_AUTHORS | json }}'
        MAX_AGE_DAYS: '{{ inputs.max_age_days | default: 60 }}'
      code: |
        import sys
        sys.path.insert(0, '/etc/dev-env-scripts')
        from team_review_digest import collect_digest
        return collect_digest()

  # A fresh, creative opening every run, written from the day's real numbers. No idempotency key, so the
  # reply is never cached; if the agent fails, the digest uses a plain greeting and no call to action.
  - name: write_intro
    type: workflow.execute
    on-failure:
      continue: true
    with:
      workflow-id: main-kibana-agent
      inputs:
        cwd: /opt/kibana-cache
        disallow_shell: true
        model: sonnet
        prompt: >-
          You write the opening of the daily "PRs waiting for review" digest for a software team's Slack
          channel. The team builds Kibana workflows, an automation engine. It is a {{ 'now' | date: '%A' }}
          morning. These are the only facts you may use, and you must never invent numbers, names or PRs:
          {{ steps.collect_digest.output.stats | json }}. Return exactly two findings. First, kind `greeting`:
          a fresh, creative good-morning line, at most 100 characters, with a pun or a small image if it
          fits. Second, kind `nudge`: one sentence, at most 150 characters, that turn the facts into
          a friendly, specific call to action, for example point at the PRs ready to merge, the longest
          waiting PR (write its number like #123), or the easy win, and invite people to claim a PR by
          replying in the thread with :eyes:. Light humor is welcome. Use at most two emoji in total, written
          as Slack shortcodes like :coffee:. No hashtags, no @-mentions, no markdown, no quotation marks, and
          no stock phrases like "rise and shine". Put the text of each in its `comment`; the response can
          just say done.

  - name: format_digest
    type: ssh.python
    connector-id: dev-vm
    timeout: 5m
    with:
      env:
        DIGEST_JSON: '{{ steps.collect_digest.output.data | json }}'
        INTRO_JSON: '{{ steps.write_intro.output.findings | json }}'
        MAX_TEAM_PRS: '{{ inputs.max_team_prs | default: 10 }}'
        MAX_APPROVED_PRS: '{{ inputs.max_approved_prs | default: 5 }}'
        MAX_CONTRIBUTOR_PRS: '{{ inputs.max_contributor_prs | default: 5 }}'
      code: |
        import sys
        sys.path.insert(0, '/etc/dev-env-scripts')
        from team_review_digest import format_review_digest
        return format_review_digest()

  - name: post_digest
    type: if
    condition: "${{ inputs.post != false }}"
    steps:
      - name: choose_channel
        type: if
        condition: "${{ inputs.test_channel == true }}"
        steps:
          # Test runs go to #test-channel through the bot.
          - name: post_to_test_channel
            type: slack_api.postMessage
            connector-id: slack-bot
            on-failure:
              continue: true
            with:
              channelIds:
                - C0BDEQKS0N4 # #test-channel
              text: '{{ steps.format_digest.output.message }}'
        else:
          - name: post_to_team_channel
            type: slack
            connector-id: one-workflow-eng
            on-failure:
              continue: true
            with:
              message: '{{ steps.format_digest.output.message }}'

  - name: output
    type: workflow.output
    with:
      pending_count: ${{ steps.format_digest.output.pending_count }}
      contributor_count: ${{ steps.format_digest.output.contributor_count }}
      approved_count: ${{ steps.format_digest.output.approved_count }}
      bot_count: ${{ steps.collect_digest.output.data.bot_count }}
      stale_count: ${{ steps.collect_digest.output.data.stale_count }}
      message: '{{ steps.format_digest.output.message }}'
