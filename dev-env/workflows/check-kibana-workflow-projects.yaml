version: '1'
name: Check Changed Kibana Workflow Projects
description: Runs targeted lint autofix and unit tests for changed workflow-owned projects on dev-vm.
enabled: true
tags:
  - kibana
  - workflows
  - validation

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - source_dir
        - projects
        - changed_files
      properties:
        source_dir:
          type: string
        projects:
          type: array
          items:
            type: object
            required:
              - id
              - source_root
            properties:
              id:
                type: string
              source_root:
                type: string
        changed_files:
          type: array
          items:
            type: string
        check_mode:
          type: string
          enum:
            - all
            - lint
            - tests
          default: all
        max_diagnostic_chars:
          type: integer
          default: 12000

steps:
  - name: check_projects
    type: ssh.python
    connector-id: dev-vm
    with:
      cwd: '{{ inputs.source_dir }}'
      env:
        PROJECTS_JSON: '{{ inputs.projects | json }}'
        FILES_JSON: '{{ inputs.changed_files | json }}'
        CHECK_MODE: '{{ inputs.check_mode | default: "all" }}'
        MAX_DIAGNOSTIC_CHARS: '{{ inputs.max_diagnostic_chars | default: 12000 }}'
      code: |
        import sys

        sys.path.insert(0, '/etc/dev-env-scripts')
        from check_workflow_projects import check_workflow_projects

        return check_workflow_projects()

  - name: output
    type: workflow.output
    with:
      results: '{{ steps.check_projects.output.results | json }}'
      lint_failures: '{{ steps.check_projects.output.lint_failures | json }}'
      test_failures: '{{ steps.check_projects.output.test_failures | json }}'
      has_lint_failures: '{{ steps.check_projects.output.has_lint_failures }}'
      has_test_failures: '{{ steps.check_projects.output.has_test_failures }}'
      all_passed: '{{ steps.check_projects.output.all_passed }}'
      log_dir: '{{ steps.check_projects.output.log_dir }}'