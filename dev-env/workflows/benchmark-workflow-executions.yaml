version: '1'
name: Benchmark Workflow Executions
description: |
  Deploys one Kibana preview per entry in `deployments`, then benchmarks
  workflow-execution throughput and scheduling lag against each one.

  Deploy and benchmark run pairwise inside a foreach, so only one preview is
  under load at a time — concurrent benchmarks on the same dev-vm would
  contend for CPU and corrupt the numbers.

  Each iteration writes a full JSON report to the main ES index (see
  consts.REPORT_INDEX) and returns a compact summary as the step output.
  Progress goes to stderr, which surfaces as Kibana workflow execution logs.
enabled: true
tags:
  - kibana
  - benchmark
  - workflows

settings:
  # Never run two benchmarks at once: they would compete for dev-vm CPU.
  concurrency:
    key: '{{ workflow.id }}'
    strategy: queue

consts:
  REPORT_INDEX: workflow-benchmarks
  host: dev-vm
  WORKFLOW_ID: benchmark-no-op

triggers:
  - type: manual
    inputs:
      properties:
        deployments:
          type: array
          description: |
            One entry per preview to deploy and benchmark. Fields mirror the
            deploy-kibana-preview inputs; omitted fields fall back to that
            workflow's defaults.
          minItems: 1
          items:
            type: object
            properties:
              kibana_target:
                type: string
                description: GitHub PR / branch / commit URL to deploy.
              elastic_password:
                type: string
                description: Password for the elastic user in this preview.
              workflows_group:
                type: string
                enum:
                  - scheduled
                  - sanity
                description: Which workflows library to mount into the preview.
            required:
              - kibana_target
        count:
          type: integer
          description: Number of executions to schedule per preview.
          default: 1000
          minimum: 1
        concurrency:
          type: integer
          description: HTTP concurrency used while scheduling executions.
          default: 50
          minimum: 1
      required:
        - deployments

steps:
  # ── Deploy + benchmark, one preview at a time ─────────────────────────────
  - name: run_matrix
    type: foreach
    foreach: '${{ inputs.deployments }}'
    steps:
      # Blocks until the child workflow completes; its output is the summary
      # object emitted by deploy-kibana-preview's final `summary` step.
      - name: deploy
        type: workflow.execute
        with:
          workflow-id: deploy-kibana-preview
          inputs:
            kibana_target: '{{ foreach.item.kibana_target }}'
            # Liquid `default` matters here: a missing key renders as an empty
            # string, which would OVERRIDE the child's default rather than
            # letting it apply.
            elastic_password: '{{ foreach.item.elastic_password | default: "1ab1db3e-838a-4b1e-9944-88084c553998" }}'
            workflows_group: '${{ foreach.item.workflows_group | default: "benchmark_no_op" }}'
      
      - name: record_benchmark_start
        type: data.set
        with:
          ts: '{{ "now" | date: "%Y-%m-%dT%H:%M:%SZ" }}'

      - name: wait
        type: wait
        with:
          duration: 5m

      - name: fetch_benchmark_metrics
        type: elasticsearch.request
        with:
          method: POST
          path: /workflow_metrics/_search
          body:
            size: 10000
            query:
              bool:
                filter:
                  - term:
                      project: '{{ steps.deploy.output.project }}'
                  - range:
                      '@timestamp':
                        gte: '{{ steps.record_benchmark_start.output.ts }}'

      - name: build_report
        type: code.javascript
        with:
          code: |
            const PROJECT = "{{ steps.deploy.output.project }}";
            const TARGET = "{{ steps.deploy.output.target }}";
            const COMMIT = "{{ steps.deploy.output.commit }}";
            const WF = "{{ consts.WORKFLOW_ID }}";
            const COUNT = parseInt("{{ inputs.count }}", 10);

            const docs = {{ steps.fetch_benchmark_metrics.output.hits.hits | map: "_source" | json }};

            const byMetric = (name) => docs.filter(d => d.metric === name);
            const countDocs    = byMetric('workflow.count');
            const durationDocs = byMetric('workflow.duration');
            const queueDocs    = byMetric('workflow.queueTime');
            const e2eDocs      = byMetric('workflow.e2eLatency');

            const completed = durationDocs.length;
            const failed    = countDocs.filter(d => d.status !== 'completed').length;

            const s2 = (v) => v != null ? Number((v / 1000).toFixed(2)) : null;

            const percentiles = (values) => {
              if (!values.length) return null;
              const sorted = [...values].sort((a, b) => a - b);
              const p = (pct) => sorted[Math.floor(sorted.length * pct)];
              const sum = sorted.reduce((a, b) => a + b, 0);
              return {
                count: sorted.length,
                min_s: s2(sorted[0]),
                avg_s: s2(sum / sorted.length),
                p50_s: s2(p(0.50)),
                p75_s: s2(p(0.75)),
                p95_s: s2(p(0.95)),
                p99_s: s2(p(0.99)),
                max_s: s2(sorted[sorted.length - 1])
              };
            };

            const finishTimes = countDocs
              .filter(d => d.status === 'completed' && d.finishedAt)
              .map(d => new Date(d.finishedAt).getTime())
              .sort((a, b) => a - b);

            const buckets = [];
            if (finishTimes.length) {
              const minT = finishTimes[0];
              const maxT = finishTimes[finishTimes.length - 1];
              for (let t = minT; t <= maxT; t += 30000) {
                const c = finishTimes.filter(ft => ft >= t && ft < t + 30000).length;
                if (c > 0) buckets.push({
                  window_start: new Date(t).toISOString(),
                  completed: c,
                  rps: Number((c / 30).toFixed(2))
                });
              }
            }
            const peakRps = buckets.length ? Math.max(...buckets.map(b => b.rps)) : null;

            const createdTimes = countDocs.map(d => new Date(d['@timestamp']).getTime()).sort((a, b) => a - b);
            const createdMin  = createdTimes.length ? createdTimes[0] : null;
            const finishedMax = finishTimes.length ? finishTimes[finishTimes.length - 1] : null;
            const finishedMin = finishTimes.length ? finishTimes[0] : null;
            const wallMs = createdMin && finishedMax ? finishedMax - createdMin : null;
            const spanMs = finishedMin && finishedMax ? finishedMax - finishedMin : null;
            const avgRps = spanMs && completed > 1
              ? Number(((completed - 1) / (spanMs / 1000)).toFixed(2)) : null;

            const statusBreakdown = {};
            for (const d of countDocs) {
              statusBreakdown[d.status] = (statusBreakdown[d.status] || 0) + 1;
            }

            return {
              '@timestamp': new Date().toISOString(),
              project: PROJECT, target: TARGET, commit: COMMIT,
              workflow_id: WF, requested: COUNT,
              total_wall_time_s: wallMs != null ? Number((wallMs / 1000).toFixed(1)) : null,
              status_breakdown: statusBreakdown,
              throughput: {
                completed, failed,
                completion_span_s: s2(spanMs),
                avg_rps: avgRps, peak_rps_30s: peakRps,
                over_time: buckets
              },
              scheduling_lag: percentiles(queueDocs.map(d => d.value)),
              e2e_latency: percentiles(e2eDocs.map(d => d.value)),
              execution_duration: percentiles(durationDocs.map(d => d.value))
            };

      - name: index_report
        type: elasticsearch.request
        with:
          method: POST
          path: '/{{ consts.REPORT_INDEX }}/_doc'
          body: '{{ steps.build_report.output }}'

  - name: done
    type: console
    with:
      message: >-
        Benchmarked {{ inputs.deployments | size }} preview(s).
        Full reports indexed to {{ consts.REPORT_INDEX }} on the main ES.
