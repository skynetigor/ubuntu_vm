version: '1'
name: Main Kibana Agent
description: >-
  Reusable entry point for calling an agent. agent: claude (the default) runs Claude
  Code on dev-vm over SSH, and falls back to GitHub Copilot CLI on dev-vm when Claude
  is out of budget or cannot authenticate (checked up front, remembered in key-value
  until Claude's reset time, and detected again if it happens mid-run). agent: copilot
  runs Copilot CLI directly. agent: ab runs the Agent Builder agent we created
  (dev-env, from dev-env/agents.yml) with the ai.agent step, in a stored conversation. Pass the returned session_id on later calls to continue
  the same Claude/Copilot session or Agent Builder conversation. All return the same
  fields (response, run_summary, findings, changes, pull_request, session_id, agent_used);
  response, run_summary, and pull_request.body are GitHub-flavored Markdown. An
  optional idempotency_key reuses the complete response stored in key-value
  without invoking the agent again. Empty keys bypass caching.
enabled: true
tags:
  - kibana
  - claude
  - copilot
  - agent-builder

triggers:
  - type: manual
    inputs:
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: Message or instruction to send to the agent.
        agent:
          type: string
          enum:
            - claude
            - copilot
            - ab
          default: claude
          description: >-
            claude runs Claude Code on dev-vm (falling back to Copilot when Claude is out of budget or
            unauthenticated). copilot runs GitHub Copilot CLI on dev-vm. ab runs the Agent Builder agent
            we created (consts.AB_AGENT_ID, from dev-env/agents.yml) with the ai.agent step.
        session_id:
          type: string
          description: >-
            Claude or Copilot (copilot:<id>) session ID, or the Agent Builder conversation ID when agent
            is ab, to resume; omit to start a new one. A session from the other CLI agent starts a new
            session that gets run_summary as context.
        cwd:
          type: string
          description: >-
            Remote working directory for Claude Code. Agent Builder agents get it as a hint in the
            message when it is not the default.
          default: /opt/ubuntu_vm
        run_summary:
          type: string
          description: Markdown summary from the previous phase in this workflow run.
        disallow_shell:
          type: boolean
          default: false
          description: >-
            Disable Claude's Bash tool for restricted automation calls. Agent Builder agents are
            only told not to run shell commands, which is not enforced.
        model:
          type: string
          default: ''
          pattern: '^[A-Za-z0-9._-]*$'
          description: Claude model or alias for this call; empty uses the CLI default. Not used for Copilot or Agent Builder agents.
        copilot_model:
          type: string
          default: ''
          pattern: '^[A-Za-z0-9._-]*$'
          description: >-
            Copilot CLI model for agent copilot and for the Claude fallback; empty uses COPILOT_MODEL on
            dev-vm, then claude-sonnet-5.5.
        inference_id:
          type: string
          default: ''
          pattern: '^[A-Za-z0-9._-]*$'
          description: >-
            Inference endpoint or connector id the Agent Builder agent uses as its model, for example
            azure-gpt-5-chat; empty uses the Agent Builder default. Not used for claude.
        idempotency_key:
          type: string
          default: ''
          maxLength: 400
          pattern: '^[A-Za-z0-9._:@/-]*$'
          description: Cache key for an equivalent request and workspace state; cached responses do not replay edits.

settings:
  concurrency:
    key: 'main-kibana-agent:{{ inputs.idempotency_key | default: execution.id }}'
    strategy: queue
    max: 1

consts:
  # The Agent Builder agent that agent: ab runs (created from dev-env/agents.yml).
  AB_AGENT_ID: dev-env
  # key-value doc that remembers Claude is out of budget / unauthenticated until value.until_epoch.
  CLAUDE_HEALTH_DOC: 'agent-health%3Aclaude'

steps:
  - name: initialize_state
    type: data.set
    with:
      result: {}
      use_copilot: ${{ inputs.agent == 'copilot' }}
      claude_ready: false

  # Claude keeps the original cache ids; other agents get their own so the same key never mixes answers.
  - name: lookup_cached_response
    type: if
    condition: "${{ inputs.idempotency_key != '' }}"
    steps:
      - name: get_cached_response
        type: elasticsearch.request
        with:
          method: POST
          path: /key-value/_mget
          body:
            ids:
              - 'agent:{% if inputs.agent == "ab" %}ab:{% elsif inputs.agent == "copilot" %}copilot:{% endif %}{{ inputs.idempotency_key }}'

      - name: return_when_cached
        type: if
        condition: "${{ steps.get_cached_response.output.docs[0].found == true }}"
        steps:
          - name: cached_output
            type: workflow.output
            with:
              response: '${{ steps.get_cached_response.output.docs[0]._source.value.response }}'
              run_summary: '${{ steps.get_cached_response.output.docs[0]._source.value.run_summary }}'
              findings: '${{ steps.get_cached_response.output.docs[0]._source.value.findings }}'
              changes: '${{ steps.get_cached_response.output.docs[0]._source.value.changes }}'
              pull_request: '${{ steps.get_cached_response.output.docs[0]._source.value.pull_request }}'
              session_id: '${{ steps.get_cached_response.output.docs[0]._source.value.session_id }}'
              agent_used: '${{ steps.get_cached_response.output.docs[0]._source.value.agent_used | default: inputs.agent }}'

  # Decide whether Claude can take the job: a remembered outage skips the probe until Claude's reset
  # time; otherwise a tiny Haiku call checks budget and auth. Only budget/auth problems route to Copilot.
  - name: check_claude_ready
    type: if
    condition: "${{ inputs.agent == 'claude' }}"
    steps:
      - name: get_claude_health
        type: elasticsearch.request
        with:
          method: POST
          path: /key-value/_mget
          body:
            ids:
              - 'agent-health:claude'

      - name: evaluate_claude_health
        type: code.javascript
        with:
          code: |
            const doc = {{ steps.get_claude_health.output.docs[0] | json }};
            const value = doc && doc.found ? doc._source.value || {} : {};
            const untilEpoch = Number(value.until_epoch || 0);
            return {
              known_unavailable: untilEpoch * 1000 > Date.now(),
              reason: value.reason || '',
              until: untilEpoch ? new Date(untilEpoch * 1000).toISOString() : '',
            };

      - name: route_on_claude_health
        type: if
        condition: "${{ steps.evaluate_claude_health.output.known_unavailable == true }}"
        steps:
          - name: skip_claude_while_unavailable
            type: data.set
            with:
              use_copilot: true
        else:
          - name: probe_claude
            type: ssh.python
            connector-id: dev-vm
            with:
              code: |
                import sys

                sys.path.insert(0, '/etc/dev-env-scripts')
                from check_claude_ready import check_claude_ready

                return check_claude_ready()

          - name: save_claude_readiness
            type: data.set
            with:
              claude_ready: ${{ steps.probe_claude.output.ready }}
              use_copilot: ${{ steps.probe_claude.output.ready == false }}

          - name: remember_claude_unavailable
            type: if
            condition: "${{ steps.probe_claude.output.ready == false }}"
            steps:
              - name: save_claude_health_from_probe
                type: elasticsearch.request
                with:
                  method: PUT
                  path: '/key-value/_doc/{{ consts.CLAUDE_HEALTH_DOC }}'
                  body:
                    value:
                      reason: '{{ steps.probe_claude.output.reason }}'
                      message: '{{ steps.probe_claude.output.message }}'
                      until_epoch: ${{ steps.probe_claude.output.until_epoch }}
                      updated_at: '{{ "now" | date: "%Y-%m-%dT%H:%M:%S%:z" }}'

  - name: run_claude
    type: if
    condition: "${{ inputs.agent == 'claude' and variables.claude_ready == true }}"
    steps:
      - name: claude
        type: ssh.python
        connector-id: dev-vm
        with:
          cwd: '{{ inputs.cwd | default: "/opt/ubuntu_vm" }}'
          env:
            CLAUDE_PROMPT: '{{ inputs.prompt }}'
            CLAUDE_SESSION_ID: '{{ inputs.session_id | default: "" }}'
            CLAUDE_RUN_SUMMARY: '{{ inputs.run_summary | default: "" }}'
            CLAUDE_DISALLOW_SHELL: '{{ inputs.disallow_shell | default: false }}'
            CLAUDE_MODEL: '{{ inputs.model | default: "" }}'
          code: |
            import sys

            sys.path.insert(0, '/etc/dev-env-scripts')
            from agent_errors import ClaudeUnavailable
            from run_claude_agent import run_claude_agent

            # Budget or auth trouble that starts mid-run hands the job to Copilot instead of failing.
            try:
                return run_claude_agent()
            except ClaudeUnavailable as error:
                return error.to_output()

      - name: route_on_claude_result
        type: if
        condition: "${{ steps.claude.output.claude_unavailable == true }}"
        steps:
          - name: fall_back_to_copilot
            type: data.set
            with:
              use_copilot: true

          - name: save_claude_health_from_run
            type: elasticsearch.request
            with:
              method: PUT
              path: '/key-value/_doc/{{ consts.CLAUDE_HEALTH_DOC }}'
              body:
                value:
                  reason: '{{ steps.claude.output.reason }}'
                  message: '{{ steps.claude.output.message }}'
                  until_epoch: ${{ steps.claude.output.until_epoch }}
                  updated_at: '{{ "now" | date: "%Y-%m-%dT%H:%M:%S%:z" }}'
        else:
          - name: save_claude_result
            type: data.set
            with:
              result: ${{ steps.claude.output }}

  - name: run_copilot
    type: if
    condition: "${{ variables.use_copilot == true }}"
    steps:
      - name: copilot
        type: ssh.python
        connector-id: dev-vm
        with:
          cwd: '{{ inputs.cwd | default: "/opt/ubuntu_vm" }}'
          env:
            AGENT_PROMPT: '{{ inputs.prompt }}'
            AGENT_SESSION_ID: '{{ inputs.session_id | default: "" }}'
            AGENT_RUN_SUMMARY: '{{ inputs.run_summary | default: "" }}'
            AGENT_DISALLOW_SHELL: '{{ inputs.disallow_shell | default: false }}'
            AGENT_CWD: '{{ inputs.cwd | default: "/opt/ubuntu_vm" }}'
            COPILOT_MODEL_OVERRIDE: '{{ inputs.copilot_model | default: "" }}'
          code: |
            import os
            import sys

            sys.path.insert(0, '/etc/dev-env-scripts')
            from run_copilot_agent import run_copilot_agent

            environment = dict(os.environ)
            if environment.get('COPILOT_MODEL_OVERRIDE', '').strip():
                environment['COPILOT_MODEL'] = environment['COPILOT_MODEL_OVERRIDE']
            return run_copilot_agent(environment)

      - name: save_copilot_result
        type: data.set
        with:
          result: ${{ steps.copilot.output }}

  # Agent Builder agents get the same result fields through a structured output schema, so callers can
  # use either agent. The conversation is stored (and public) so it shows up in Agent Builder, and its
  # id comes back as session_id, like Claude's session id.
  - name: run_agent_builder_agent
    type: if
    condition: "${{ inputs.agent == 'ab' }}"
    steps:
      - name: build_agent_message
        type: data.set
        with:
          agent_message: |-
            {% if inputs.run_summary != blank %}Context from the earlier steps of this run:
            {{ inputs.run_summary }}

            {% endif %}{% if inputs.cwd != '/opt/ubuntu_vm' %}Working directory on dev-vm: {{ inputs.cwd }}
            {% endif %}{% if inputs.disallow_shell %}Do not run shell commands and do not use the dev-vm connector.
            {% endif %}{{ inputs.prompt }}

            Fill the structured output like this: response is your answer; run_summary is a short handoff
            summary for the next phase; findings and changes are lists (empty when there are none);
            pull_request is only for a drafted pull request.

      - name: start_conversation
        type: if
        condition: "${{ inputs.session_id == nil or inputs.session_id == '' }}"
        steps:
          - name: agent_builder_new
            type: ai.agent
            timeout: 30m
            agent-id: '{{ consts.AB_AGENT_ID }}'
            inference-id: '{{ inputs.inference_id }}'
            create-conversation: true
            public-conversation: true
            with:
              message: '{{ variables.agent_message }}'
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: Answer for the user, formatted as GitHub-flavored Markdown.
                  run_summary:
                    type: string
                    description: Handoff summary for the next phase, formatted as GitHub-flavored Markdown.
                  findings:
                    type: array
                  changes:
                    type: array
                  pull_request:
                    type: object
                    properties:
                      title:
                        type: string
                      body:
                        type: string
                        description: Pull request description, formatted as GitHub-flavored Markdown.
                    required:
                      - title
                      - body
                    additionalProperties: false
                required:
                  - response
                  - run_summary
                  - findings
                  - changes
                additionalProperties: false

          - name: save_new_result
            type: data.set
            with:
              result:
                response: '{{ steps.agent_builder_new.output.structured_output.response | default: steps.agent_builder_new.output.message }}'
                run_summary: '{{ steps.agent_builder_new.output.structured_output.run_summary }}'
                findings: ${{ steps.agent_builder_new.output.structured_output.findings }}
                changes: ${{ steps.agent_builder_new.output.structured_output.changes }}
                pull_request: ${{ steps.agent_builder_new.output.structured_output.pull_request }}
                session_id: '{{ steps.agent_builder_new.output.conversation_id }}'

      - name: continue_conversation
        type: if
        condition: "${{ inputs.session_id != nil and inputs.session_id != '' }}"
        steps:
          - name: agent_builder_continue
            type: ai.agent
            timeout: 30m
            agent-id: '{{ consts.AB_AGENT_ID }}'
            inference-id: '{{ inputs.inference_id }}'
            create-conversation: true
            public-conversation: true
            with:
              conversation_id: '{{ inputs.session_id }}'
              message: '{{ variables.agent_message }}'
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: Answer for the user, formatted as GitHub-flavored Markdown.
                  run_summary:
                    type: string
                    description: Handoff summary for the next phase, formatted as GitHub-flavored Markdown.
                  findings:
                    type: array
                  changes:
                    type: array
                  pull_request:
                    type: object
                    properties:
                      title:
                        type: string
                      body:
                        type: string
                        description: Pull request description, formatted as GitHub-flavored Markdown.
                    required:
                      - title
                      - body
                    additionalProperties: false
                required:
                  - response
                  - run_summary
                  - findings
                  - changes
                additionalProperties: false

          - name: save_continued_result
            type: data.set
            with:
              result:
                response: '{{ steps.agent_builder_continue.output.structured_output.response | default: steps.agent_builder_continue.output.message }}'
                run_summary: '{{ steps.agent_builder_continue.output.structured_output.run_summary }}'
                findings: ${{ steps.agent_builder_continue.output.structured_output.findings }}
                changes: ${{ steps.agent_builder_continue.output.structured_output.changes }}
                pull_request: ${{ steps.agent_builder_continue.output.structured_output.pull_request }}
                session_id: '{{ steps.agent_builder_continue.output.conversation_id }}'

  - name: cache_response_when_keyed
    type: if
    condition: "${{ inputs.idempotency_key != '' }}"
    steps:
      - name: save_cached_response
        type: elasticsearch.request
        with:
          method: PUT
          path: '/key-value/_doc/agent%3A{% if inputs.agent == "ab" %}ab%3A{% elsif inputs.agent == "copilot" %}copilot%3A{% endif %}{{ inputs.idempotency_key | url_encode }}'
          body:
            value: ${{ variables.result }}

  - name: output
    type: workflow.output
    with:
      response: '{{ variables.result.response }}'
      run_summary: '{{ variables.result.run_summary }}'
      findings: ${{ variables.result.findings }}
      changes: ${{ variables.result.changes }}
      pull_request: ${{ variables.result.pull_request }}
      session_id: '{{ variables.result.session_id }}'
      agent_used: '{{ variables.result.agent_used | default: inputs.agent }}'
