version: '1'
name: Run Kibana Unit Tests
description: >-
  Runs Jest unit tests for the given Kibana projects on dev-vm, one project at a
  time, and reports which projects passed, failed, or have no tests.
enabled: true
tags:
  - kibana
  - tests

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - source_dir
        - projects
      properties:
        source_dir:
          type: string
          description: Kibana source root on dev-vm, e.g. /opt/<project>/kibana/src.
        projects:
          type: array
          description: >-
            Projects to test; a source_root without jest.config.js is reported as no_tests.
            Earlier results can be passed back directly (project is used when id is absent).
          items:
            type: object
            required:
              - source_root
            properties:
              id:
                type: string
              project:
                type: string
              source_root:
                type: string
        timeout_seconds:
          type: integer
          default: 1800
          minimum: 60
        diagnostic_chars:
          type: integer
          default: 12000
          minimum: 500

consts:
  # Jest recycles workers on heapUsed only; SWC transforms leak native memory outside the heap,
  # so a low limit restarts workers after almost every file and frees that memory.
  MAX_WORKERS: 3
  WORKER_IDLE_MEMORY_LIMIT: 600MB
  WORKER_HEAP_MB: 3072

# Same literal key as checkout-kibana-project and run-kibana-eslint: one heavy Node job at a time on dev-vm.
settings:
  # A hung SSH session otherwise blocks the run until the engine's default workflow timeout.
  timeout: 2h
  concurrency:
    key: dev-vm-node-heavy
    strategy: queue
    max: 1

steps:
  - name: initialize_results
    type: data.set
    with:
      results: []

  - name: prepare_runner
    type: ssh.run
    connector-id: dev-vm
    with:
      cwd: '{{ inputs.source_dir }}'
      env:
        SOURCE_ROOTS: '{{ inputs.projects | map: "source_root" | join: " " }}'
      command: |
        set -euo pipefail
        for root in $SOURCE_ROOTS; do
          case "$root" in
            /*|*..*|*[!A-Za-z0-9_./-]*) echo "Invalid source root: $root" >&2; exit 1 ;;
          esac
        done

        # Kibana's Jest wrapper writes its cache and JUnit reports to fixed repo paths.
        mkdir -p data/jest-cache target/junit
        [ -f node_modules/.workflow-runner-acl ] || setfacl -R -m u:workflow-runner:rwx node_modules/
        for dir in data/jest-cache target/junit; do
          setfacl -m u:workflow-runner:rwx "$dir"
          setfacl -d -m u:workflow-runner:rwx "$dir"
        done
        for root in $SOURCE_ROOTS; do
          [ -d "$root" ] || continue
          setfacl -R -m u:workflow-runner:rwx "$root" || echo "warning: could not grant access to $root" >&2
          setfacl -R -d -m u:workflow-runner:rwx "$root" 2>/dev/null || true
        done

        runner=(sudo -n -u workflow-runner env -i HOME=/home/workflow-runner PATH=/usr/local/bin:/usr/bin:/bin)
        "${runner[@]}" git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$PWD" \
          || "${runner[@]}" git config --global --add safe.directory "$PWD"

        # Logs live on the persistent /opt volume so they survive a VM restart.
        logs_root=/opt/kibana-cache/unit-test-logs
        mkdir -p "$logs_root"
        find "$logs_root" -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} + 2>/dev/null || true
        log_dir=$(mktemp -d "$logs_root/run-XXXXXX")
        echo "Logs: $log_dir"
        printf '{"log_dir":"%s"}' "$log_dir" > "$STEP_OUTPUT"

  - name: test_projects
    type: foreach
    foreach: ${{ inputs.projects }}
    max-iterations:
      limit: 50
      on-limit: fail
    steps:
      - name: run_jest
        type: ssh.run
        connector-id: dev-vm
        with:
          cwd: '{{ inputs.source_dir }}'
          env:
            PROJECT_ID: '{{ foreach.item.id | default: foreach.item.project }}'
            SOURCE_ROOT: '{{ foreach.item.source_root }}'
            LOG_DIR: '{{ steps.prepare_runner.output.log_dir }}'
            MAX_WORKERS: '{{ consts.MAX_WORKERS }}'
            WORKER_IDLE_MEMORY_LIMIT: '{{ consts.WORKER_IDLE_MEMORY_LIMIT }}'
            WORKER_HEAP_MB: '{{ consts.WORKER_HEAP_MB }}'
            TIMEOUT_SECONDS: '{{ inputs.timeout_seconds }}'
            DIAGNOSTIC_CHARS: '{{ inputs.diagnostic_chars }}'
          command: |
            set -uo pipefail
            case "$SOURCE_ROOT" in
              /*|*..*|*[!A-Za-z0-9_./-]*) echo "Invalid source root: $SOURCE_ROOT" >&2; exit 1 ;;
            esac
            config="${SOURCE_ROOT%/}/jest.config.js"
            safe_id=$(printf '%s' "$PROJECT_ID" | tr -c 'A-Za-z0-9_.-' '_')
            log="$LOG_DIR/$safe_id-jest.log"
            # Kibana's scripts/jest rejects --workerIdleMemoryLimit, so a wrapper config sets it.
            wrapper="$LOG_DIR/$safe_id-jest.config.js"
            printf "const path = require('path');\nconst original = path.resolve('%s', '%s');\nconst config = require(original);\nmodule.exports = { ...config, rootDir: path.resolve(path.dirname(original), config.rootDir || '.'), workerIdleMemoryLimit: '%s' };\n" \
              "$PWD" "$config" "$WORKER_IDLE_MEMORY_LIMIT" > "$wrapper"
            chmod 755 "$LOG_DIR"
            chmod 644 "$wrapper"
            started=$(date +%s)
            workers="$MAX_WORKERS"
            attempts=1

            run_jest() {
              local budget=$(( TIMEOUT_SECONDS - ($(date +%s) - started) ))
              jest_args=(scripts/jest.js --config "$wrapper" --passWithNoTests "--maxWorkers=$workers")
              # timeout runs as workflow-runner so it can kill the whole Jest worker group.
              sudo -n -u workflow-runner env -i \
                HOME=/home/workflow-runner PATH=/usr/local/bin:/usr/bin:/bin \
                NODE_PATH=/home/kibana/.nvm/versions/node/current/lib/node_modules \
                NODE_OPTIONS="--max-old-space-size=$WORKER_HEAP_MB" \
                CI=true DISABLE_SWC_REGISTER_CACHE=1 \
                timeout -k 30 "$budget" node "${jest_args[@]}" > "$log" 2>&1
              exit_code=$?
            }

            if [ -f "$config" ]; then
              run_jest
              # A killed worker usually means memory pressure; retry once with a single worker.
              if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ] && [ "$workers" -gt 1 ] \
                  && [ $(( TIMEOUT_SECONDS - ($(date +%s) - started) )) -gt 120 ] \
                  && { [ "$exit_code" -eq 137 ] || grep -q 'terminated by another process: signal=SIGKILL' "$log"; }; then
                echo "[$PROJECT_ID] worker killed with $workers workers (exit=$exit_code), retrying with 1 worker"
                cp "$log" "$log.attempt1"
                workers=1; attempts=2
                run_jest
              fi
            else
              echo "No $config" > "$log"
              exit_code=0
              jest_args=(scripts/jest.js --config "$wrapper")
            fi
            elapsed=$(( $(date +%s) - started ))

            clean="$log.clean"
            sed 's/\x1b\[[0-9;]*m//g' "$log" > "$clean"
            if [ ! -d "$SOURCE_ROOT" ]; then
              status=failed; reason=missing_project
            elif [ ! -f "$config" ]; then
              status=no_tests; reason=no_jest_config
            elif [ "$exit_code" -eq 124 ] || { [ "$exit_code" -eq 137 ] && [ "$elapsed" -ge "$TIMEOUT_SECONDS" ]; }; then
              status=failed; reason=timeout
            elif [ "$exit_code" -eq 137 ]; then
              status=failed; reason=out_of_memory
            elif [ "$exit_code" -ne 0 ] && grep -q 'terminated by another process: signal=SIGKILL' "$clean"; then
              status=failed; reason=worker_killed
            elif [ "$exit_code" -ne 0 ]; then
              status=failed; reason=test_failures
            elif grep -qiE 'No tests found|No test files found' "$clean"; then
              status=no_tests; reason=''
            else
              status=passed; reason=''
            fi

            echo "[$PROJECT_ID] $status${reason:+ ($reason)} exit=$exit_code in ${elapsed}s"
            grep -E '^(FAIL |Test Suites:|Tests:)' "$clean" | sort -u

            export STATUS="$status" REASON="$reason" EXIT_CODE="$exit_code" LOG="$log" CLEAN="$clean" \
              COMMAND="node ${jest_args[*]}" WORKERS="$workers" ATTEMPTS="$attempts"
            python3 -c '
            import json, os, re
            e = os.environ
            text = open(e["CLEAN"], errors="replace").read()
            json.dump({
                "project": e["PROJECT_ID"],
                "source_root": e["SOURCE_ROOT"],
                "status": e["STATUS"],
                "reason": e["REASON"],
                "exit_code": int(e["EXIT_CODE"]),
                "max_workers": int(e["WORKERS"]),
                "attempts": int(e["ATTEMPTS"]),
                "command": e["COMMAND"],
                "failed_suites": sorted(set(re.findall(r"^FAIL\s+(\S+)", text, re.M))),
                "diagnostic": text[-int(e["DIAGNOSTIC_CHARS"]):],
                "log_path": e["LOG"],
            }, open(e["STEP_OUTPUT"], "w"))
            '

      - name: record_result
        type: data.set
        with:
          results: "${{ variables.results | push: steps.run_jest.output }}"

  - name: classify_results
    type: data.set
    with:
      passed: "${{ variables.results | where: 'status', 'passed' }}"
      no_tests: "${{ variables.results | where: 'status', 'no_tests' }}"
      failed: "${{ variables.results | where: 'status', 'failed' }}"

  - name: output
    type: workflow.output
    with:
      results: ${{ variables.results }}
      passed: ${{ variables.passed }}
      no_tests: ${{ variables.no_tests }}
      failed: ${{ variables.failed }}
      all_passed: ${{ variables.failed.size == 0 }}
      log_dir: '{{ steps.prepare_runner.output.log_dir }}'
