version: '1'
name: Run Kibana ESLint
description: >-
  Runs ESLint with --fix on the given Kibana projects on dev-vm, one project at a
  time, and reports which projects are clean, which still have lint errors, and
  which files the autofix changed.
enabled: true
tags:
  - kibana
  - lint

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - source_dir
        - projects
      properties:
        source_dir:
          type: string
          description: Kibana source root on dev-vm, e.g. /opt/<project>/kibana/src.
        projects:
          type: array
          description: >-
            Projects to lint. Without files, the whole source_root is linted; with
            files, only those repository-relative paths are linted (an empty list skips the project).
          items:
            type: object
            required:
              - id
              - source_root
            properties:
              id:
                type: string
              source_root:
                type: string
              files:
                type: array
                items:
                  type: string
        timeout_seconds:
          type: integer
          default: 1800
          minimum: 60
        diagnostic_chars:
          type: integer
          default: 12000
          minimum: 500

consts:
  # Shared with run-kibana-unit-tests so Jest and ESLint never run concurrently on dev-vm.
  CHECK_LOCK_PATH: /tmp/kbn-workflow-jest.lock

steps:
  - name: initialize_results
    type: data.set
    with:
      results: []
      fixed_files: []

  - name: prepare_runner
    type: ssh.run
    connector-id: dev-vm
    with:
      cwd: '{{ inputs.source_dir }}'
      env:
        SOURCE_ROOTS: '{{ inputs.projects | map: "source_root" | join: " " }}'
      command: |
        set -euo pipefail
        for root in $SOURCE_ROOTS; do
          case "$root" in
            /*|*..*|*[!A-Za-z0-9_./-]*) echo "Invalid source root: $root" >&2; exit 1 ;;
          esac
        done

        setfacl -R -m u:workflow-runner:rwx node_modules
        for root in $SOURCE_ROOTS; do
          [ -d "$root" ] || continue
          setfacl -R -m u:workflow-runner:rwx "$root" || echo "warning: could not grant access to $root" >&2
          setfacl -R -d -m u:workflow-runner:rwx "$root" 2>/dev/null || true
        done

        runner=(sudo -n -u workflow-runner env -i HOME=/home/workflow-runner PATH=/usr/local/bin:/usr/bin:/bin)
        "${runner[@]}" git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$PWD" \
          || "${runner[@]}" git config --global --add safe.directory "$PWD"

        log_dir=$(mktemp -d /tmp/kbn-eslint-XXXXXX)
        echo "Logs: $log_dir"
        printf '{"log_dir":"%s"}' "$log_dir" > "$STEP_OUTPUT"

  - name: lint_projects
    type: foreach
    foreach: ${{ inputs.projects }}
    max-iterations:
      limit: 50
      on-limit: fail
    steps:
      - name: run_eslint
        type: ssh.run
        connector-id: dev-vm
        with:
          cwd: '{{ inputs.source_dir }}'
          env:
            PROJECT_ID: '{{ foreach.item.id }}'
            SOURCE_ROOT: '{{ foreach.item.source_root }}'
            LINT_SCOPE: '{% if foreach.item.files == nil %}project{% else %}files{% endif %}'
            FILES: '{{ foreach.item.files | join: " " }}'
            LOG_DIR: '{{ steps.prepare_runner.output.log_dir }}'
            LOCK_PATH: '{{ consts.CHECK_LOCK_PATH }}'
            TIMEOUT_SECONDS: '{{ inputs.timeout_seconds }}'
            DIAGNOSTIC_CHARS: '{{ inputs.diagnostic_chars }}'
          command: |
            set -uo pipefail
            case "$SOURCE_ROOT" in
              /*|*..*|*[!A-Za-z0-9_./-]*) echo "Invalid source root: $SOURCE_ROOT" >&2; exit 1 ;;
            esac
            root="${SOURCE_ROOT%/}"
            base="$LOG_DIR/$(printf '%s' "$PROJECT_ID" | tr -c 'A-Za-z0-9_.-' '_')"
            log="$base-eslint.log"
            targets=("$root")
            if [ "$LINT_SCOPE" = files ]; then
              targets=()
              for file in $FILES; do
                case "$file" in
                  "$root"/*) ;;
                  *) echo "File outside $root: $file" >&2; exit 1 ;;
                esac
                case "$file" in
                  *..*|*[!A-Za-z0-9_./@-]*) echo "Invalid file path: $file" >&2; exit 1 ;;
                esac
                [ -f "$file" ] && targets+=("$file")
              done
            fi
            eslint_args=(scripts/eslint.js --fix "${targets[@]}")
            started=$(date +%s)

            # Hash dirty files before and after to report exactly what --fix changed.
            snapshot() {
              git ls-files -m -o --exclude-standard -- "$root" | sort | xargs -r -d '\n' md5sum
            }

            if [ -d "$root" ] && [ "${#targets[@]}" -eq 0 ]; then
              echo "No lintable files" > "$log"
              exit_code=0
              : > "$base.fixed"
            elif [ -d "$root" ]; then
              snapshot > "$base.before"
              echo "[$PROJECT_ID] waiting for check lock"
              # timeout runs as workflow-runner so it can kill the whole ESLint process group.
              flock "$LOCK_PATH" \
                sudo -n -u workflow-runner env -i \
                  HOME=/home/workflow-runner PATH=/usr/local/bin:/usr/bin:/bin \
                  NODE_PATH=/home/kibana/.nvm/versions/node/current/lib/node_modules \
                  CI=true DISABLE_SWC_REGISTER_CACHE=1 \
                  timeout -k 30 "$TIMEOUT_SECONDS" node "${eslint_args[@]}" > "$log" 2>&1
              exit_code=$?
              snapshot > "$base.after"
              comm -13 "$base.before" "$base.after" | cut -c35- > "$base.fixed"
            else
              echo "Missing project directory $root" > "$log"
              exit_code=127
              : > "$base.fixed"
            fi

            clean="$log.clean"
            sed 's/\x1b\[[0-9;]*m//g' "$log" > "$clean"
            if [ ! -d "$root" ]; then
              status=failed; reason=missing_project
            elif [ "${#targets[@]}" -eq 0 ]; then
              status=passed; reason=no_files
            elif [ "$exit_code" -eq 0 ]; then
              status=passed; reason=''
            elif [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ]; then
              status=failed; reason=timeout
            elif [ "$exit_code" -eq 1 ]; then
              status=failed; reason=lint_errors
            else
              status=failed; reason=crashed
            fi

            echo "[$PROJECT_ID] $status${reason:+ ($reason)} exit=$exit_code in $(( $(date +%s) - started ))s, autofixed $(wc -l < "$base.fixed") file(s)"
            grep -E '✖ [0-9]+ problems?|Found [0-9]+ (warnings?|errors?)' "$clean" || true

            export STATUS="$status" REASON="$reason" EXIT_CODE="$exit_code" LOG="$log" CLEAN="$clean" \
              FIXED="$base.fixed" COMMAND="node ${eslint_args[*]}"
            python3 -c '
            import json, os, re
            e = os.environ
            text = open(e["CLEAN"], errors="replace").read()
            source = r"\S+\.(?:[cm]?js|jsx|tsx?)"
            # ESLint prints the file path on its own line; Oxlint prints "ERROR path:line:col".
            error_paths = re.findall(rf"^({source})$", text, re.M) + re.findall(rf"^ERROR\s+({source}):\d+:\d+", text, re.M)
            json.dump({
                "project": e["PROJECT_ID"],
                "source_root": e["SOURCE_ROOT"],
                "status": e["STATUS"],
                "reason": e["REASON"],
                "exit_code": int(e["EXIT_CODE"]),
                "command": e["COMMAND"],
                "fixed_files": [line for line in open(e["FIXED"]).read().splitlines() if line],
                "files_with_errors": sorted({path.removeprefix(os.getcwd() + "/") for path in error_paths}),
                "diagnostic": text[-int(e["DIAGNOSTIC_CHARS"]):],
                "log_path": e["LOG"],
            }, open(e["STEP_OUTPUT"], "w"))
            '

      - name: record_result
        type: data.set
        with:
          results: "${{ variables.results | push: steps.run_eslint.output }}"
          fixed_files: "${{ variables.fixed_files | concat: steps.run_eslint.output.fixed_files }}"

  - name: classify_results
    type: data.set
    with:
      passed: "${{ variables.results | where: 'status', 'passed' }}"
      failed: "${{ variables.results | where: 'status', 'failed' }}"

  - name: output
    type: workflow.output
    with:
      results: ${{ variables.results }}
      passed: ${{ variables.passed }}
      failed: ${{ variables.failed }}
      fixed_files: ${{ variables.fixed_files }}
      all_passed: ${{ variables.failed.size == 0 }}
      log_dir: '{{ steps.prepare_runner.output.log_dir }}'
