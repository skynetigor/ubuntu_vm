version: '1'
name: Cleanup Expired Previews
description: |
  Runs every 10 minutes. Queries the deployed-previews index for entries whose
  per-document TTL (ttl_days) has elapsed since updated_at, then delegates
  each teardown to the cleanup-preview workflow.

  Adjust ttl_days per deployment at deploy time via the deploy-kibana-preview
  workflow input (default: 3 days). The clock resets on every redeploy.
enabled: true
tags:
  - kibana
  - preview
  - cleanup
  - scheduled

triggers:
  - type: scheduled
    with:
      interval: 10m
  - type: manual

steps:
  # ── Find previews whose per-document TTL has elapsed ─────────────────────
  # Each document carries its own ttl_days (set at deploy time). The Painless
  # script computes the expiry threshold per document. Fallback: 3 days for
  # documents deployed before ttl_days was introduced.
  - name: find_expired
    type: elasticsearch.request
    with:
      method: POST
      path: /deployed-previews/_search
      body:
        size: 50
        query:
          script:
            script:
              lang: painless
              source: >-
                long ttl = doc['ttl_days'].size() > 0
                  ? (long) doc['ttl_days'].value : 3L;
                return doc['updated_at'].value.toInstant().toEpochMilli()
                  < System.currentTimeMillis() - ttl * 86400000L;
        _source: []

  # ── Delegate each teardown to cleanup-preview ─────────────────────────────
  - name: cleanup_each
    type: foreach
    foreach: '${{ steps.find_expired.output.hits.hits }}'
    steps:
      - name: cleanup
        type: workflow.execute
        with:
          workflow-id: cleanup-preview
          inputs:
            project: '{{ foreach.item._id }}'

  - name: done
    type: console
    with:
      message: >-
        Cleanup pass complete.
        Processed {{ steps.find_expired.output.hits.hits | size }} expired preview(s).
