version: '1'
name: Cleanup Expired Previews
description: |
  Runs every 10 minutes. Queries the deployed-previews index for entries whose
  per-document TTL (ttl_days) has elapsed since updated_at, then delegates
  each teardown to the cleanup-preview workflow.

  Adjust ttl_days per deployment at deploy time via the deploy-kibana-preview
  workflow input (default: 3 days). The clock resets on every redeploy.
enabled: true
tags:
  - kibana
  - preview
  - cleanup
  - scheduled

triggers:
  - type: scheduled
    with:
      every: 10m
  - type: manual

steps:
  - name: fetch_all
    type: elasticsearch.request
    with:
      method: POST
      path: /deployed-previews/_search
      body:
        size: 50
        _source:
          - updated_at
          - ttl_days

  - name: find_expired
    type: code.javascript
    with:
      code: |
        const hits = {{ steps.fetch_all.output.hits.hits | json }};
        const now = Date.now();
        return hits.filter(h => {
          const ttlDays = h._source.ttl_days ?? 3;
          const updatedAt = new Date(h._source.updated_at).getTime();
          return now - updatedAt > ttlDays * 86400000;
        }).map(h => h._id);

  # ── Delegate each teardown to cleanup-preview ─────────────────────────────
  - name: cleanup_each
    type: foreach
    foreach: '${{ steps.find_expired.output }}'
    steps:
      - name: cleanup
        type: workflow.execute
        with:
          workflow-id: cleanup-preview
          inputs:
            project: '{{ foreach.item }}'

  - name: docker_prune
    type: remoteHost.runCommand
    connector-id: dev-vm
    on-failure:
      continue: true
    with:
      code: |
        docker system prune -f
        echo "=== docker system prune complete ==="

  - name: done
    type: console
    with:
      message: >-
        Cleanup pass complete.
        Processed {{ steps.find_expired.output | size }} expired preview(s).
