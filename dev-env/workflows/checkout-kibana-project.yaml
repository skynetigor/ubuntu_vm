version: '1'
name: Checkout Kibana Project
description: >-
  Resolves a Kibana GitHub target, prepares its project checkout, fetches
  additional branches into explicit refs, and bootstraps dependencies for the
  checked-out commit. Skips target checkout when HEAD matches and skips bootstrap
  when already bootstrapped at HEAD.
enabled: true
tags:
  - kibana
  - checkout
  - git

triggers:
  - type: manual
    inputs:
      additionalProperties: false
      required:
        - kibana_target
      properties:
        kibana_target:
          type: string
          description: GitHub PR, branch, or commit URL.
        target_depth:
          type: integer
          default: 256
          minimum: 1
        additional_branches:
          type: array
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - repository
              - branch
              - ref
            properties:
              repository:
                type: string
              branch:
                type: string
              ref:
                type: string
                description: Full local ref, for example refs/remotes/workflow-review/main.
              depth:
                type: integer
                minimum: 1
        bootstrap:
          type: boolean
          default: true
          description: Install dependencies for the checked-out commit.
        project_name:
          type: string
          default: ''
          pattern: '^[a-z0-9-]{0,50}$'
          description: Fixed project directory under /opt shared across targets; always reset and cleaned. Empty derives it from the target.

consts:
  UBUNTU_VM_REPO: https://github.com/skynetigor/ubuntu_vm.git
  UBUNTU_VM_BRANCH: main
  BOOTSTRAP_CACHE_ROOT: /opt/kibana-cache

# Same literal key as run-kibana-unit-tests and run-kibana-eslint: one heavy Node job at a time on dev-vm.
settings:
  concurrency:
    key: dev-vm-node-heavy
    strategy: queue
    max: 1

steps:
  - name: initialize_state
    type: data.set
    with:
      bootstrap_status: not_requested
  - name: checkout
    type: ssh.python
    connector-id: dev-vm
    with:
      env:
        KIBANA_TARGET: '{{ inputs.kibana_target }}'
        TARGET_DEPTH: '{{ inputs.target_depth }}'
        ADDITIONAL_BRANCHES_JSON: '{{ inputs.additional_branches | json }}'
        PROJECT_NAME: '{{ inputs.project_name }}'
        UBUNTU_VM_REPO: '{{ consts.UBUNTU_VM_REPO }}'
        UBUNTU_VM_BRANCH: '{{ consts.UBUNTU_VM_BRANCH }}'
      code: |
        import sys
        sys.path.insert(0, '/etc/dev-env-scripts')
        from checkout_kibana_project import checkout_kibana_project
        return checkout_kibana_project()

  - name: bootstrap_when_requested
    type: if
    condition: "${{ inputs.bootstrap == true }}"
    steps:
      - name: bootstrap
        type: ssh.run
        connector-id: dev-vm
        with:
          env:
            DEPLOY_DIR: '{{ steps.checkout.output.deploy_dir }}'
            KIBANA_SRC: '{{ steps.checkout.output.source_dir }}'
            BOOTSTRAP_CACHE_ROOT: '{{ consts.BOOTSTRAP_CACHE_ROOT }}'
          command: |
            bash "$DEPLOY_DIR/kibana/scripts/bootstrap.sh"

      - name: save_bootstrap_status
        type: data.set
        with:
          bootstrap_status: '{{ steps.bootstrap.output.status }}'

      # Test and lint runners skip the slow recursive ACL pass while this marker exists.
      - name: grant_runner_access
        type: ssh.run
        connector-id: dev-vm
        with:
          cwd: '{{ steps.checkout.output.source_dir }}'
          env:
            BOOTSTRAP_STATUS: '{{ steps.bootstrap.output.status }}'
          command: |
            set -euo pipefail
            marker=node_modules/.workflow-runner-acl
            if [ "$BOOTSTRAP_STATUS" = bootstrapped ] || [ ! -f "$marker" ]; then
              echo "Granting workflow-runner access to node_modules"
              setfacl -R -m u:workflow-runner:rwx node_modules/
              touch "$marker"
            else
              echo "node_modules access already granted"
            fi

  - name: output
    type: workflow.output
    with:
      project: '{{ steps.checkout.output.project }}'
      target: '{{ steps.checkout.output.target }}'
      commit: '{{ steps.checkout.output.commit }}'
      source_repository: '{{ steps.checkout.output.source_repository }}'
      source_branch: '{{ steps.checkout.output.source_branch }}'
      deploy_dir: '{{ steps.checkout.output.deploy_dir }}'
      source_dir: '{{ steps.checkout.output.source_dir }}'
      checkout_changed: '{{ steps.checkout.output.checkout_changed }}'
      clone_skipped: '{{ steps.checkout.output.clone_skipped }}'
      fetched_branches: '{{ steps.checkout.output.fetched_branches | json }}'
      bootstrap_status: '{{ variables.bootstrap_status }}'