id: rebuild-kibana-on-push
name: Rebuild Kibana on Push
description: >
  Polls the ubuntu_vm repo for new commits on main every 2 minutes.
  When the remote SHA differs from the local HEAD at /opt/ubuntu_vm,
  pulls the latest code and rebuilds the kibana container in-place.
enabled: true

triggers:
  - type: scheduled
    with:
      interval: 2m

steps:
  - name: check_and_rebuild
    type: remoteHost.runCommand
    connector-id: dev-vm
    with:
      code: |
        REPO_DIR="/opt/ubuntu_vm"
        COMPOSE_FILE="$REPO_DIR/dev-env/docker-compose.yml"

        LOCAL_SHA=$(git -C "$REPO_DIR" rev-parse HEAD 2>/dev/null || echo "")
        REMOTE_SHA=$(git -C "$REPO_DIR" ls-remote origin main 2>/dev/null | cut -f1)

        if [ -z "$REMOTE_SHA" ]; then
          echo "Could not reach remote — skipping"
          exit 0
        fi

        if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
          echo "Up to date ($LOCAL_SHA)"
          exit 0
        fi

        echo "New commit detected: $LOCAL_SHA → $REMOTE_SHA"
        git -C "$REPO_DIR" fetch --depth 1 origin main
        git -C "$REPO_DIR" reset --hard FETCH_HEAD

        echo "Rebuilding kibana..."
        docker compose -f "$COMPOSE_FILE" up -d --build kibana
        echo "Done"
