services:
  dev-vm:
    build: ../elastic_dev_vm
    container_name: elastic-dev-vm
    privileged: true
    ports:
      - "2222:22"
      - "5003-5999:5003-5999"
    environment:
      - SSH_KEYS_BASE64=${SSH_KEYS_BASE64:-}
      - CF_DOMAIN=${CF_DOMAIN:-}
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - CF_TUNNEL_ID=${CF_TUNNEL_ID:-}
    volumes:
      - ${DEV_VM_HOME:-~/docker-files/elastic-dev-vm/home}:/root
      - dev-vm-docker:/var/lib/docker
      - dev-vm-opt:/opt
    networks:
      - elastic
    restart: unless-stopped

  elasticsearch:
    build:
      context: ../kibana
      dockerfile: es.Dockerfile
    environment:
      - ES_VERSION=${ES_VERSION:-9.6.0}
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
      - ES_LICENSE=trial
      - ES_BASE_DIR=/es
    ports:
      - "5001:9200"
    volumes:
      - es_data:/es
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf -u elastic:$$ES_PASSWORD http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - elastic
    restart: unless-stopped

  kibana:
    build:
      context: ../kibana
      args:
        NODE_VERSION: ${NODE_VERSION:-24.18.0}
    env_file:
      - path: ./env/.env
        required: false
    environment:
      - KIBANA_BRANCH=${KIBANA_BRANCH:-main}
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
      - KIBANA_PUBLIC_URL=https://${CF_SUBDOMAIN:-}.${CF_DOMAIN:-}
      - ES_HOST=http://elasticsearch:9200
      - KIBANA_SSH_PRIVATE_KEY_BASE64=${KIBANA_SSH_PRIVATE_KEY_BASE64:-}
      - CONNECTORS_FILE=/opt/kibana/setup/env/connectors.yml
      - WORKFLOWS_DIR=/opt/kibana/setup/workflows

    ports:
      - "5002:5601"
    volumes:
      - ../kibana/kibana.dev.yml:/etc/kibana-config/kibana.dev.yml:ro
      - ./env:/opt/kibana/setup/env:ro
      - ./workflows:/opt/kibana/setup/workflows:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - elastic
    restart: unless-stopped

networks:
  elastic:
    driver: bridge

volumes:
  es_data:
  dev-vm-docker:
  dev-vm-opt:
