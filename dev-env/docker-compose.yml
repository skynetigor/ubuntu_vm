services:
  dev-vm:
    build: ../elastic_dev_vm
    env_file:
      - path: ./env/vm.env
        required: false
      - path: ./env/cloudflare.env
        required: false
    container_name: elastic-dev-vm
    privileged: true
    ports:
      - "2222:22"
      - "5003-5999:5003-5999"
    environment:
      - SSH_KEYS_BASE64=${SSH_KEYS_BASE64:-}
    volumes:
      - ${DEV_VM_HOME:-~/docker-files/elastic-dev-vm/home}:/root
      - dev-vm-docker:/var/lib/docker
      - dev-vm-opt:/opt
      - ./env:/etc/dev-env:ro
    networks:
      - elastic
    restart: unless-stopped

  elasticsearch:
    build:
      context: ../kibana
      dockerfile: es.Dockerfile
    env_file:
      - path: ./env/es.env
        required: false
    environment:
      - ES_VERSION=${ES_VERSION:-9.6.0}
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
      - ES_LICENSE=trial
      - ES_BASE_DIR=/es
    ports:
      - "5001:9200"
    volumes:
      - es_data:/es
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf -u elastic:$$ES_PASSWORD http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - elastic
    restart: unless-stopped

  kibana:
    build:
      context: ../kibana
    env_file:
      - path: ./env/es.env
        required: false
      - path: ./env/kibana.env
        required: false
      - path: ./env/cloudflare.env
        required: false
    environment:
      - KIBANA_PUBLIC_URL=https://${CF_SUBDOMAIN:-}.${CF_DOMAIN:-}
      - ES_HOST=http://elasticsearch:9200
      - ELASTIC_APM_ACTIVE=true
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_SERVICE_NAME=kibana-main
      - ELASTIC_APM_CONTEXT_PROPAGATION_ONLY=false
      - ELASTIC_APM_SECRET_TOKEN=
      - WORKFLOWS_DIR=/opt/kibana/setup/workflows
      - CONNECTORS_FILE=/opt/kibana/setup/env/connectors.yml
      - DASHBOARDS_DIR=/opt/kibana/setup/dashboards
    ports:
      - "5002:5601"
    volumes:
      - ../kibana/kibana.dev.yml:/etc/kibana-config/kibana.dev.yml:ro
      # Main-Kibana-only config. Do NOT also set KIBANA_CONFIG_OVERRIDES_B64 for
      # this service: entrypoint.sh would try to write to this read-only path.
      - ./kibana.override.yml:/opt/kibana/config/kibana.override.yml:ro
      - ./env/connectors.yml:/opt/kibana/setup/env/connectors.yml:ro
      - ./workflows:/opt/kibana/setup/workflows:ro
      - ./dashboards:/opt/kibana/setup/dashboards:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf -u "elastic:$$ES_PASSWORD" http://localhost:5601/api/status | grep -q "\"level\":\"available\""'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    restart: unless-stopped

  apm-server:
    # NOT tied to ES_VERSION: that is a snapshot version (9.6.0) with no
    # published image. Pin to a released apm-server tag instead.
    image: docker.elastic.co/apm/apm-server:${APM_SERVER_VERSION:-8.11.0}
    volumes:
      - ./apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    environment:
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
    ports:
      - "8200:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    restart: unless-stopped

  workflows-ui:
    build:
      context: ../webapp
    container_name: workflows-ui
    ports:
      - '${WEBAPP_PORT:-5000}:5000'
    environment:
      - ES_HOST=http://elasticsearch:9200
      - KIBANA_HOST=http://kibana:5601
      - CF_SUBDOMAIN=workflows-ui
      - CF_SERVICE_URL=http://workflows-ui:5000
    env_file:
      - path: ./env/cloudflare.env
        required: false
      - path: ./env/webapp.env
        required: false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file:
      - path: ./env/cloudflare.env
        required: false
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
    networks:
      - elastic
    restart: unless-stopped

networks:
  elastic:
    driver: bridge

volumes:
  es_data:
  dev-vm-docker:
  dev-vm-opt:
