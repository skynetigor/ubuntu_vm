server.port: 5601
server.host: "0.0.0.0"

elasticsearch.hosts: ['http://localhost:9200']
elasticsearch.username: kibana_system
elasticsearch.password: ${ES_PASSWORD}

xpack.encryptedSavedObjects.encryptionKey: "dev-encryption-key-32-chars-minimum"

uiSettings.overrides:
  workflows:ui:enabled: true
  workflows:aiAgent:enabled: true
  agentBuilder:experimentalFeatures: true

uiSettings.globalOverrides:
  workflowsManagement:library:enabled: true
  workflowsManagement:globalExecutionsView:enabled: true

workflowsManagement.enabled: true
workflowsExecutionEngine.enabled: true
