services:
  elasticsearch:
    build:
      context: .
      dockerfile: es.Dockerfile
    environment:
      - ES_VERSION=${ES_VERSION:-9.6.0}
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
      - ES_LICENSE=trial
      - ES_BASE_DIR=/es
    ports:
      - "5021:9200"   # ES API
      - "5022:5601"   # Kibana (shares ES network namespace via network_mode: service:elasticsearch)
    volumes:
      - es_data:/es
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf -u elastic:$$ES_PASSWORD http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  kibana:
    build:
      context: .
    environment:
      - KIBANA_BRANCH=${KIBANA_BRANCH:-main}
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
    network_mode: "service:elasticsearch"
    volumes:
      # KIBANA_SRC must point to an already-built Kibana directory on the host.
      # Set it in your shell or a .env file:  KIBANA_SRC=D:\path\to\kibana
      - ${KIBANA_SRC}:/opt/kibana
      - ./kibana.dev.yml:/etc/kibana-config/kibana.dev.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es_data:
